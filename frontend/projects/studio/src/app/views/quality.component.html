<header class="qv-head">
  <p class="qv-crumb">{{ t('nav.group.auswertung') }}</p>
  <h2 class="qv-title">{{ t('view.analyse.label') }}</h2>
  <p class="qv-intro">{{ t('qual.intro') }}</p>
</header>

<fieldset class="qv-scope">
  <legend>{{ t('qual.scope.legend') }}</legend>
  @for (option of scopes(); track option.id) {
    <label class="qv-scope-option">
      <input
        type="radio"
        name="qv-scope"
        [value]="option.id"
        [checked]="scope() === option.id"
        (change)="setScope(option.id)"
      />
      <span class="qv-scope-label">{{ option.label }}</span>
      <span class="qv-scope-hint">{{ option.hint }}</span>
    </label>
  }
</fieldset>

<studio-tab-bar
  [label]="t('nav.group.auswertung')"
  [tabs]="tabs()"
  [active]="active()"
  (tabChange)="select($event)"
/>

<div
  id="panel-uebersicht"
  role="tabpanel"
  aria-labelledby="tab-uebersicht"
  tabindex="0"
  [hidden]="active() !== 'uebersicht'"
>
  @if (shows()('uebersicht')) {
    <studio-quality-overview [scope]="scope()" (drill)="drill($event)" />
  }
</div>

<div
  id="panel-matrix"
  role="tabpanel"
  aria-labelledby="tab-matrix"
  tabindex="0"
  [hidden]="active() !== 'matrix'"
>
  @if (shows()('matrix')) {
    <studio-quality-matrix [scope]="scope()" (drill)="drill($event)" />
  }
</div>

<div
  id="panel-flow"
  role="tabpanel"
  aria-labelledby="tab-flow"
  tabindex="0"
  [hidden]="active() !== 'flow'"
>
  @if (shows()('flow')) {
    <studio-quality-flow [scope]="scope()" />
  }
</div>

<div
  id="panel-logs"
  role="tabpanel"
  aria-labelledby="tab-logs"
  tabindex="0"
  [hidden]="active() !== 'logs'"
>
  @if (shows()('logs')) {
    <studio-quality-logs
      [scope]="scope()"
      [filters]="filters()"
      (filtersChange)="filters.set($event)"
    />
  }
</div>
