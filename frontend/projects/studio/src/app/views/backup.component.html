<div class="bk">
  <header class="bk-head">
    <!-- h2, nicht h1: das <h1> der Seite ist die Marke in der Shell-Kopfzeile.
         Zwei h1 machen die Überschriften-Liste eines Screenreaders unbrauchbar
         (WCAG 1.3.1). Die übrigen Seiten-Views setzen ebenfalls h2. -->
    <h2 class="bk-title">{{ t('view.sicherung.label') }}</h2>
    <p class="bk-intro">{{ t('backup.intro') }}</p>
  </header>

  <section class="op-panel" aria-labelledby="bk-full-title">
    <h2 class="op-title" id="bk-full-title">{{ t('backup.full.title') }}</h2>
    <p class="op-lead">{{ t('backup.full.lead') }}</p>

    <div class="op-actions">
      <button
        type="button"
        class="op-btn op-btn--primary"
        [disabled]="action.busy()"
        (click)="download()"
      >
        {{ action.isRunning('backup') ? t('backup.packing') : t('backup.download') }}
      </button>
    </div>

    <div class="bk-upload">
      <label class="op-label" for="bk-file">{{ t('backup.uploadLabel') }}</label>
      <input type="file" class="bk-file" id="bk-file" accept=".zip" (change)="onFile($event)" />
      <button
        type="button"
        class="op-btn op-btn--danger"
        [disabled]="!file() || action.busy()"
        (click)="arm()"
      >
        {{ action.isRunning('restore') ? t('backup.restoring') : t('backup.restore') }}
      </button>
    </div>

    @if (armed()) {
      <p class="op-confirm" role="alert">
        <span>{{ t('backup.confirmRestore', { name: file()?.name ?? '' }) }}</span>
        <button type="button" class="op-btn op-btn--danger" (click)="restore()">
          {{ t('backup.confirmRestoreYes') }}
        </button>
        <button type="button" class="op-btn" (click)="disarm()">{{ t('action.cancel') }}</button>
      </p>
    }

    @if (action.message(); as msg) {
      <p
        class="op-msg"
        [class.op-msg--error]="msg.kind === 'error'"
        [attr.role]="msg.kind === 'error' ? 'alert' : 'status'"
      >{{ msg.kind === 'error' ? '⚠ ' : '✓ ' }}{{ msg.text }}</p>
    }
  </section>

  <studio-snapshots-panel />
  <studio-factory-panel />
</div>
