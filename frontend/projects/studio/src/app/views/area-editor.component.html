<header class="ae-head">
  <p class="ae-crumb">{{ t('areaEditor.crumb') }}</p>
  <h2 class="ae-title">{{ area() }}</h2>
</header>

@if (loading()) {
  <p class="ae-state" aria-busy="true">{{ t('areaEditor.loading') }}</p>
} @else if (loadError()) {
  <div class="ae-state ae-state--error" role="alert">
    <p>{{ loadError() }}</p>
    <button type="button" class="ae-btn" (click)="load()">{{ t('async.retry') }}</button>
  </div>
} @else {
  <!-- Both panels stay in the DOM (`hidden` on the inactive one) so every
       `aria-controls` the shared strip writes resolves. -->
  <studio-tab-bar
    [tabs]="tabs()"
    [active]="activeTab()"
    [label]="t('areaEditor.tabsLabel')"
    (tabChange)="onTabChange($event)"
  />

  <section
    id="panel-ae-form"
    role="tabpanel"
    aria-labelledby="tab-ae-form"
    tabindex="-1"
    [hidden]="tab() !== 'form'"
  >
    @if (schema(); as loaded) {
      <studio-schema-form
        [schema]="loaded"
        [value]="doc()"
        [idPrefix]="'ae'"
        (valueChange)="onDoc($event)"
        (errorsChange)="onFieldErrors($event)"
      />
    }
  </section>

  <section
    id="panel-ae-raw"
    role="tabpanel"
    aria-labelledby="tab-ae-raw"
    tabindex="-1"
    [hidden]="tab() !== 'raw'"
  >
    <label class="ae-raw-label" for="ae-raw">
      {{ filePath() }}
      <span class="ae-hint">— {{ t('areaEditor.rawHint') }}</span>
    </label>
    <textarea
      id="ae-raw"
      class="ae-raw"
      rows="26"
      spellcheck="false"
      [value]="rawText()"
      (input)="onRawInput($event)"
    ></textarea>
  </section>

  <div class="ae-actions">
    <button
      type="button"
      class="ae-btn ae-btn--primary"
      [disabled]="saving() || !dirty() || blocked()"
      (click)="save()"
    >
      {{ saving() ? t('editor.saving') : t('editor.save') }}
    </button>
    <button type="button" class="ae-btn" [disabled]="saving() || !dirty()" (click)="discard()">
      {{ t('editor.discard') }}
    </button>
    @if (dirty()) {
      <span class="ae-dirty">{{ t('editor.unsaved') }}</span>
    }
  </div>

  @if (saveError()) {
    <p class="ae-state ae-state--error" role="alert">{{ saveError() }}</p>
  }
  <p class="ae-status" aria-live="polite">{{ status() }}</p>
}
