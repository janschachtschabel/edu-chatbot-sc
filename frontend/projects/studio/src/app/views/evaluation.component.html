<studio-tab-bar
  [label]="t('eval.label')"
  [tabs]="tabs()"
  [active]="active()"
  (tabChange)="select($event)"
/>

<div
  id="panel-laeufe"
  class="ev-panel"
  role="tabpanel"
  aria-labelledby="tab-laeufe"
  tabindex="0"
  [hidden]="active() !== 'laeufe'"
>
  @if (shows()('laeufe')) {
    <studio-eval-runs
      (runChange)="openDetail($event)"
      (deleted)="onRunDeleted($event)"
      (stopped)="onRunStopped($event)"
      (compare)="openCompare($event)"
    />
    @if (openRun(); as id) {
      <studio-eval-run-detail [runId]="id" (dismiss)="closeDetail()" />
    }
    @if (compareIds().length > 0) {
      <studio-eval-compare [runIds]="compareIds()" (dismiss)="closeCompare()" />
    }
    <!-- Nutzer-Feedback 2026-08-22: Läufe zuerst — wer die Seite öffnet, will
         den AKTIVEN Lauf sehen, nicht die Flow-Liste des nächsten Starts.
         Die Formulare bleiben montiert (laden ihre Daten), nur zugeklappt. -->
    <details class="ev-start">
      <summary>{{ t('evalStart.gold.title') }}</summary>
      <studio-eval-golden-start [busy]="busy()" (started)="onStarted()" />
    </details>
    <details class="ev-start">
      <summary>{{ t('evalStart.gen.title') }}</summary>
      <studio-eval-generative-start [busy]="busy()" (started)="onStarted()" />
    </details>
  }
</div>

<div
  id="panel-trends"
  class="ev-panel"
  role="tabpanel"
  aria-labelledby="tab-trends"
  tabindex="0"
  [hidden]="active() !== 'trends'"
>
  @if (shows()('trends')) {
    <studio-eval-trends />
  }
</div>

<div
  id="panel-pattern"
  class="ev-panel"
  role="tabpanel"
  aria-labelledby="tab-pattern"
  tabindex="0"
  [hidden]="active() !== 'pattern'"
>
  @if (shows()('pattern')) {
    <studio-eval-pattern-usage />
  }
</div>

<div
  id="panel-goldflows"
  class="ev-panel"
  role="tabpanel"
  aria-labelledby="tab-goldflows"
  tabindex="0"
  [hidden]="active() !== 'goldflows'"
>
  @if (shows()('goldflows')) {
    <studio-area-section [section]="goldFlowsSection" [open]="true" />
  }
</div>
