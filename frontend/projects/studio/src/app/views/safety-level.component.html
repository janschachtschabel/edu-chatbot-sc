<fieldset class="sl">
  <legend class="sl-legend">{{ t('safetyLevel.legend') }}</legend>
  <p class="sl-hint" id="sl-hint">{{ t('safetyLevel.hint') }}</p>

  <div class="sl-grid">
    @for (level of levels(); track level.id) {
      <label class="sl-option" [class.sl-option--on]="level.id === current()">
        <input
          type="radio"
          name="security_level"
          class="sl-radio"
          [value]="level.id"
          [checked]="level.id === current()"
          [attr.aria-describedby]="'sl-desc-' + level.id"
          (change)="select(level.id)"
        />
        <span class="sl-label">{{ level.label }}</span>
        <span class="sl-desc" [id]="'sl-desc-' + level.id">
          {{ level.desc }}
          @if (!level.defined) {
            <span class="sl-missing">{{ t('safetyLevel.missing') }}</span>
          }
        </span>
      </label>
    }
  </div>

  @if (anyMissing()) {
    <p class="sl-note">{{ t('safetyLevel.note') }}</p>
  }
</fieldset>
