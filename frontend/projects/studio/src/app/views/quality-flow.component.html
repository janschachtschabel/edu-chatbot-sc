<div class="qf-bar">
  <p class="qf-total">
    @if (value(); as flow) {
      {{ total(flow) }}
    }
  </p>
  <label class="qf-field" for="qf-days">
    {{ t('qualFlow.daysLabel') }}
    <input
      id="qf-days"
      type="number"
      inputmode="numeric"
      min="1"
      max="365"
      [value]="days()"
      (input)="onDays($any($event.target).value)"
    />
  </label>
  <label class="qf-field" for="qf-min">
    {{ t('qualFlow.minCount') }}
    <input
      id="qf-min"
      type="number"
      inputmode="numeric"
      min="1"
      max="1000"
      [value]="minCount()"
      (input)="onMinCount($any($event.target).value)"
    />
  </label>
  <button type="button" class="qf-reload" [disabled]="flow.loading()" (click)="reload()">
    {{ flow.loading() ? t('action.refreshing') : t('action.refresh') }}
  </button>
</div>

<studio-async-state
  [label]="t('qual.tab.flow')"
  [loading]="flow.loading()"
  [error]="flow.error()"
  [empty]="isEmpty()"
  [emptyText]="emptyText()"
  (retry)="reload()"
/>

@if (value() && !isEmpty()) {
  <div class="qf-grid">
    <section class="qf-box">
      <studio-quality-bars [caption]="t('qualFlow.chart.states')" [data]="distribution()" />
    </section>

    <section class="qf-box">
      <studio-quality-bars
        [caption]="t('qualFlow.chart.moves')"
        [unit]="t('qualFlow.unit')"
        [data]="moves()"
      />
      @if (!hasMoves()) {
        <p class="qf-none">{{ t('qualFlow.noMoves') }}</p>
      }
    </section>

    <section class="qf-box">
      <studio-quality-bars
        [caption]="t('qualFlow.chart.repeats')"
        [unit]="t('qualFlow.unit')"
        [data]="repeats()"
      />
      @if (!hasRepeats()) {
        <p class="qf-none">{{ t('qualFlow.noRepeats') }}</p>
      }
    </section>
  </div>

  <p class="qf-legend"><studio-rich [parts]="rich('qualFlow.legend')" /></p>
}
