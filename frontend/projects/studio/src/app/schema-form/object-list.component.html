<div class="ol">
  <studio-entry-list
    class="ol-side"
    [entries]="shown()"
    [current]="current()?.id ?? null"
    [countText]="countText()"
    [query]="query()"
    [label]="label()"
    [baseId]="baseId()"
    [emptyText]="query() ? t('objectList.noMatch') : t('schemaField.emptyList')"
    (queryChange)="query.set($event)"
    (pick)="select($event)"
  >
    <div class="ol-actions">
      <button
        type="button"
        class="sf-add"
        [attr.aria-label]="t('objectList.newIn', { group: label() })"
        (click)="add()"
      >{{ t('objectList.new') }}</button>
      @if (current(); as entry) {
        <button
          type="button"
          class="sf-add"
          [attr.aria-label]="t('objectList.duplicateEntry', { title: entry.title })"
          (click)="duplicate()"
        >{{ t('objectList.duplicate') }}</button>
        <button
          type="button"
          class="sf-remove"
          [attr.aria-label]="t('objectList.removeEntry', { title: entry.title })"
          (click)="remove()"
        >{{ t('objectList.remove') }}</button>
      }
    </div>
  </studio-entry-list>

  @if (current(); as entry) {
    <div class="ol-editor">
      @if (isMap()) {
        <div class="sf-row">
          <label class="sf-label" [for]="baseId() + '-key'">{{ t('schemaField.key') }}</label>
          <input
            class="sf-input ol-key"
            type="text"
            [id]="baseId() + '-key'"
            [value]="entry.id"
            [attr.aria-invalid]="keyError() ? 'true' : null"
            [attr.aria-describedby]="keyError() ? baseId() + '-key-err' : null"
            (change)="rename($event)"
          />
          <p class="sf-error live" [id]="baseId() + '-key-err'" aria-live="polite">{{ keyError() }}</p>
        </div>
      }
      <studio-schema-field
        [field]="field().item!"
        [path]="entry.path"
        [value]="entry.value"
        [idPrefix]="idPrefix()"
        [problems]="problems()"
        [labelOverride]="entry.title"
        (edit)="edit.emit($event)"
      />
    </div>
  }
</div>
