# Prod-Stack (P10-2, Spec §4/§8): traefik (TLS+LB) · backend ×N (stateless)
# · Postgres 17+pgvector · valkey (Rate-Limit-Storage) · Jaeger · Backup-Schleife.
#
#   docker build -t boerdi-chat ..                      # Kontext = Repo-Wurzel
#   docker compose -f compose.prod.yml --env-file .env up -d
#
# **Kein TEI-Dienst.** Die P10-Zeile im Bauplan nennt ihn noch, aber V13 hat den
# Reranker-Sidecar am 2026-07-12 aus Kostengründen verworfen; `RERANK_URL` wird
# im gesamten Backend von niemandem gelesen (gemessen). Ein Dienst, mit dem
# nichts sprechen kann, gehört nicht in ein Compose.
#
# **Nur traefik veröffentlicht Ports.** Docker published Ports laufen an ufw
# vorbei (ALT-Audit T-2) — ALT musste deshalb jeden Port einzeln an 127.0.0.1
# binden. Hier hat kein Anwendungsdienst ein `ports:`, sie sind ausschließlich
# über das interne Netz erreichbar; die Jaeger-UI ist die eine Ausnahme und
# bewusst host-lokal gebunden.
name: boerdi-chat

x-logging: &logging
  # json-file-Logs wachsen sonst unbegrenzt (ALT-Audit 2026-07-09).
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    logging: *logging
    command:
      - --providers.docker=true
      # Nur Container mit `traefik.enable=true` werden geroutet — sonst stünden
      # Jaeger und die DB nach einem Tippfehler im Label öffentlich im Netz.
      - --providers.docker.exposedByDefault=false
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesResolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL fehlt}
      - --certificatesResolvers.le.acme.storage=/acme/acme.json
      - --certificatesResolvers.le.acme.tlschallenge=true
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # :ro — der Docker-Socket ist root-äquivalenter Host-Zugriff (ALT-Audit
      # T-9 hat genau das an watchtower bemängelt). traefik braucht ihn nur
      # lesend, um Labels zu entdecken.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boerdi}
      POSTGRES_DB: ${POSTGRES_DB:-boerdi}
      # Kein Default: ein Fallback-Passwort im Compose wäre ein ausgeliefertes
      # Dev-Secret. Fehlt die Variable, startet der Stack gar nicht erst.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    # Storage des Rate-Limits (V7): ohne gemeinsamen Speicher zählt jede Replika
    # ihr eigenes Kontingent, drei Replikas ließen also das Dreifache durch.
    # Kein Volume — ein verlorener Zählerstand nach Neustart ist genau ein
    # Zeitfenster lang großzügig und danach wieder korrekt.
    #
    # **Valkey statt Redis** (P10-6): Redis 8 steht unter RSALv2 / SSPLv1 /
    # AGPLv3 — alle drei auf der Verbotsliste der Eisernen Regel 1. Valkey ist
    # BSD-3-Clause (Linux Foundation), spricht dasselbe Protokoll und ist mit
    # 42 statt 114 MB auch das kleinere Image: Redis 8 bringt die Stack-Module
    # (Suche/JSON/Zeitreihen) mit, von denen wir keines anfassen.
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    logging: *logging
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    # Einmal-Lauf aus DEMSELBEN Image wie das Backend. Migrationen dürfen nicht
    # im Web-Prozess laufen: N Replikas führen sonst gleichzeitig
    # `alembic upgrade head` aus.
    #
    # Der Seed hängt dran, damit eine frische Installation ohne Handgriff
    # lauffähig ist. `--werksabgleich` (Paket 12) legt an, was fehlt, und hebt
    # unberührte Bereiche auf eine neue Werksfassung; im Studio Angepasstes und
    # Gelöschtes bleibt, wie es ist — sonst drehte jeder Neustart die
    # redaktionelle Arbeit auf den Auslieferungsstand zurück. Der Seed-Baum
    # liegt im Image unter /app/seeds, kommt also aus demselben Commit wie der
    # Code. Was angepasst ist und eine neue Werksfassung hat, zeigt das Studio
    # unter Sicherung → „Werk und eigene Fassung“.
    image: ${BOERDI_IMAGE:-boerdi-chat}
    command: ["sh", "-c", "alembic upgrade head && boerdi import-config --werksabgleich"]
    restart: "no"
    logging: *logging
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-boerdi}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@postgres:5432/${POSTGRES_DB:-boerdi}
      # Migration 0001 legt ``vector(dim)`` aus diesen drei an — dieselben
      # Werte wie beim Backend, sonst passt die Spalte nicht zu den
      # Einbettungen (Audit 2026-09-29).
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-}
      EMBED_DIM: ${EMBED_DIM:-}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ${BOERDI_IMAGE:-boerdi-chat}
    restart: unless-stopped
    logging: *logging
    deploy:
      # Zustandslos (Sessions/Config in Postgres). Seit Paket 7 (P1, Audit C-H1)
      # sperrt eine Lease in Postgres die Züge einer Sitzung über alle Repliken
      # (docs/architektur.md §8) — mehrere sind damit möglich. Vorgabe bleibt 1
      # (Paket 4, L4): die b-api zählt je Schlüssel, nicht je Replik; Faustregel
      # und Teilung von LLM_MAX_CONCURRENCY in .env.example.
      replicas: ${BACKEND_REPLICAS:-1}
    # Nacheinander: bis 5 s die eigenen Läufe schließen (Paket 17), uvicorn wartet bis
    # --timeout-graceful-shutdown (30 s) auf offene Ströme, danach der Lifespan bis
    # NACHLAUF_FRIST_S (25 s) auf nachlaufende Züge, 5 s auf ihren Abbruch, dann das
    # Aufräumen. Kürzer schösse Docker mitten in das Warten (Review Paket 9; Wächter in
    # tests/test_deploy_compose.py).
    stop_grace_period: 70s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-boerdi}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@postgres:5432/${POSTGRES_DB:-boerdi}
      # Das Schema wählt auch den Client: ``limits`` liest ``valkey://`` mit
      # valkey-py, ``redis://`` mit redis-py — und nur ersteres ist Abhängigkeit.
      RATE_LIMIT_STORAGE_URI: valkey://valkey:6379/0
      RATE_LIMIT_CHAT: ${RATE_LIMIT_CHAT:-}
      # Nur korrekt, weil kein Anwendungsdienst einen Port veröffentlicht: das
      # Backend ist ausschließlich hinter traefik erreichbar, der Header kommt
      # also nicht vom Client. Ohne das zählte das Rate-Limit die Proxy-IP.
      TRUST_FORWARDED_FOR: "true"
      # CORS. Die Liste bleibt Pflicht (`:?`) — sie ist die Angabe, die beim
      # Zumachen gilt. Die beiden Schalter MÜSSEN hier stehen: docker compose
      # liest die .env nur zur Ersetzung IN dieser Datei; was nicht unter
      # `environment:` steht, erreicht den Container nie. Ohne diese Zeilen
      # bliebe CORS_ALLOW_ALL=false aus der .env wirkungslos und CORS in
      # Produktion offen — gemessen 2026-08-18. Leer = Code-Vorgabe (offen).
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS fehlt — '*' nur bewusst setzen}
      CORS_ALLOW_ALL: ${CORS_ALLOW_ALL:-}
      CORS_ALLOW_EXTENSIONS: ${CORS_ALLOW_EXTENSIONS:-}
      # Muss hier stehen, aus demselben Grund wie die CORS-Schalter darueber:
      # was nicht unter `environment:` steht, erreicht den Container nie.
      # Leer = Code-Vorgabe (aus bzw. die vorbelegte Kennung).
      MASTER_SKILL_ENABLED: ${MASTER_SKILL_ENABLED:-}
      MASTER_SKILL_NODE_ID: ${MASTER_SKILL_NODE_ID:-}
      STUDIO_API_KEY: ${STUDIO_API_KEY:?STUDIO_API_KEY fehlt}
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:?STUDIO_PASSWORD fehlt}
      STUDIO_COOKIE_SECURE: ${STUDIO_COOKIE_SECURE:-1}
      # Paket 8 (P1/P2), leer = Code-Vorgabe: HSTS einen Tag (0 = aus), CSP der
      # Studio-Seite durchgesetzt (report = nur beobachten, off = aus).
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-}
      STUDIO_CSP: ${STUDIO_CSP:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-}
      INTERNAL_PORT: ${INTERNAL_PORT:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
      # ── LLM / MCP / RAG — Namen aus settings.py, leer = Code-Default ──
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      B_API_KEY: ${B_API_KEY:-}
      B_API_BASE_URL: ${B_API_BASE_URL:-}
      B_API_ROUTE: ${B_API_ROUTE:-}
      B_API_KEY_MODE: ${B_API_KEY_MODE:-}
      MODERATION_FAILURE_MODE: ${MODERATION_FAILURE_MODE:-}
      B_API_AUDIO: ${B_API_AUDIO:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-}
      EMBED_DIM: ${EMBED_DIM:-}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-}
      BG_LLM_MAX_CONCURRENCY: ${BG_LLM_MAX_CONCURRENCY:-}
      LLM_READ_TIMEOUT: ${LLM_READ_TIMEOUT:-}
      CLASSIFY_TIMEOUT_S: ${CLASSIFY_TIMEOUT_S:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-}
      LLM_SERVICE_TIER: ${LLM_SERVICE_TIER:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_VERBOSITY: ${LLM_VERBOSITY:-}
      B_API_CLEAR_CACHE: ${B_API_CLEAR_CACHE:-}
      CHAT_INLINE_QUICK_REPLIES: ${CHAT_INLINE_QUICK_REPLIES:-}
      AGENT_INLINE_QUICK_REPLIES: ${AGENT_INLINE_QUICK_REPLIES:-}
      # Paket 7 (L6): dokumentiert, aber bis dahin nie im Container.
      CHAT_TOKEN_STREAMING: ${CHAT_TOKEN_STREAMING:-}
      RAG_TOP_K: ${RAG_TOP_K:-}
      # Paket 11 (Nutzer 2026-10-15): Reranker, Vorgabe aus. Eingeschaltet bezieht das
      # Backend das Modell selbst ins Volume unten (RERANK_AUTO_DOWNLOAD, Vorgabe an).
      # Bis dahin standen die Schalter nicht hier und erreichten den Container nie.
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-}
      RERANK_AUTO_DOWNLOAD: ${RERANK_AUTO_DOWNLOAD:-}
      RERANK_INTRA_OP_THREADS: ${RERANK_INTRA_OP_THREADS:-}
      RERANK_MAX_CONCURRENCY: ${RERANK_MAX_CONCURRENCY:-}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-}
      RAG_MAX_CHARS_PER_AREA: ${RAG_MAX_CHARS_PER_AREA:-}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      MCP_CALL_TIMEOUT_S: ${MCP_CALL_TIMEOUT_S:-}
      # Geheimnis (C2): Zugangsblock des MCP-Servers, aus der .env auf dem
      # Server. Leer = anonym lesend. Siehe deploy/README.md.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      REPO_BASE_URL: ${REPO_BASE_URL:-}
      GUIDE_TRUSTED_DOMAINS: ${GUIDE_TRUSTED_DOMAINS:-}
      BOERDI_MAX_INGEST_MB: ${BOERDI_MAX_INGEST_MB:-}
      RAG_CONVERSION_TIMEOUT_S: ${RAG_CONVERSION_TIMEOUT_S:-}
      RAG_CONVERSION_MAX_MB: ${RAG_CONVERSION_MAX_MB:-}
      # Alte Namen (bis 2026-10): wirken übergangsweise weiter, der Start warnt.
      RAG_UMWANDLUNG_FRIST_S: ${RAG_UMWANDLUNG_FRIST_S:-}
      RAG_UMWANDLUNG_MAX_MB: ${RAG_UMWANDLUNG_MAX_MB:-}
      # Der Studio-Lasttest treibt die echte Chat-Pipeline und teilt den
      # LLM-Pool mit Live-Nutzern — auf Prod aus, er gehört auf Staging.
      # Ausdrücklich ``false``: ``${VAR:-}`` liefert einen leeren String, und
      # den liest settings.py als „nicht gesetzt" = Code-Default ``True``
      # (Audit 2026-09-29). Auf Staging ``BOERDI_ALLOW_LOADTEST=true`` setzen.
      BOERDI_ALLOW_LOADTEST: ${BOERDI_ALLOW_LOADTEST:-false}
      # Ziel der Eval-Läufe = der EIGENE Chat im selben Container (Selbstaufruf,
      # kein Umweg über traefik/TLS). Der Code-Default zeigte früher auf ALT-Port
      # 8000 — damals brach jeder Eval-Start im Preflight mit „Chat-Backend nicht
      # erreichbar" ab (gemessen auf Prod 2026-08-22). Seit Paket 15 stehen Code
      # und Image (ENV im Dockerfile) auf 8100; die Zeile bleibt als Absicherung.
      # Die .env darf weiterhin übersteuern.
      EVAL_CHAT_URL: ${EVAL_CHAT_URL:-http://127.0.0.1:8100/api/chat}
      EVAL_SIMULATOR_MODEL: ${EVAL_SIMULATOR_MODEL:-}
      EVAL_JUDGE_MODEL: ${EVAL_JUDGE_MODEL:-}
      EVAL_CHAT_TIMEOUT: ${EVAL_CHAT_TIMEOUT:-}
      # ── Paket 17 (D6): die übrigen Einstellungen aus .env.example; leer = Vorgabe im Code
      # (``env_ignore_empty``). Zugang/Test-Schalter: im Betrieb leer lassen.
      BOERDI_ALLOW_OPEN_ADMIN: ${BOERDI_ALLOW_OPEN_ADMIN:-}
      AGENT_OPEN: ${AGENT_OPEN:-}
      SPEECH_FORCE_ENABLE: ${SPEECH_FORCE_ENABLE:-}
      STT_MODEL: ${STT_MODEL:-}
      TTS_MODEL: ${TTS_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      EMBED_BACKEND: ${EMBED_BACKEND:-}
      EMBED_LOCAL_MODEL: ${EMBED_LOCAL_MODEL:-}
      EMBED_LOCAL_MODEL_DIR: ${EMBED_LOCAL_MODEL_DIR:-}
      EMBED_INGEST_PARALLEL: ${EMBED_INGEST_PARALLEL:-}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-}
      CARD_RERANKER_ENABLED: ${CARD_RERANKER_ENABLED:-}
      RAG_CHUNK_RERANKER_ENABLED: ${RAG_CHUNK_RERANKER_ENABLED:-}
      TEXT_EXTRACTION_URL: ${TEXT_EXTRACTION_URL:-}
      CARD_PIPELINE_V2: ${CARD_PIPELINE_V2:-}
      CARD_CE_TOP_N: ${CARD_CE_TOP_N:-}
      CARD_CE_GATE_COLLECTION: ${CARD_CE_GATE_COLLECTION:-}
      CARD_CE_GATE_CONTENT: ${CARD_CE_GATE_CONTENT:-}
      CHAT_DISABLE_SELECT_TOP_CARDS: ${CHAT_DISABLE_SELECT_TOP_CARDS:-}
      # Bewusst NICHT hier: BOERDI_VERSION, GIT_SHA (Build-Argumente), CONFIG_SEED_DIR,
      # WIDGET_DIST_DIR, STUDIO_DIST_DIR, EVAL_RUNNER_PATH (Pfade im Image, Dockerfile-ENV).
      # Eine leere Durchreichung überschriebe die ENV des Images mit „leer“ und damit mit der
      # Code-Vorgabe — im Compose-Betrieb sind sie über die .env nicht einstellbar.
      # Absoluter Mount-Punkt, damit die Auflösung nicht am Arbeitsverzeichnis
      # hängt. Darunter liegt das Slug-Verzeichnis des Exports.
      RERANK_MODEL_DIR: /models
    volumes:
      # Das Reranker-Modell liegt NICHT im Image — es ist ein heruntergeladenes
      # Artefakt (~135 MB), kein Quellstand. Seit Paket 11 (2026-10-15) bezieht
      # das Backend es selbst, sobald RAG_RERANKER_ENABLED an ist und es fehlt
      # (Hugging Face, fest gepinnt, Prüfwert). Dafür ist /models beschreibbar:
      # ein benanntes Volume, dessen Rechte Docker aus dem Image übernimmt; alle
      # Kopien teilen es, eine lädt (Sperrdatei). RERANK_MODEL_HOST_DIR hängt
      # stattdessen einen Ordner ein (Handinstallation, Server ohne Internet).
      - ${RERANK_MODEL_HOST_DIR:-reranker_models}:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.boerdi.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST fehlt}`)
      - traefik.http.routers.boerdi.entrypoints=websecure
      - traefik.http.routers.boerdi.tls.certresolver=le
      - traefik.http.services.boerdi.loadbalancer.server.port=8100

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    restart: unless-stopped
    logging: *logging
    ports:
      # Einziger host-gebundener Port außer traefik — und nur auf 127.0.0.1:
      # die Traces enthalten Prompt-Metadaten und gehören nicht ins Internet.
      # Zugriff per SSH-Tunnel (Runbook).
      - "127.0.0.1:16686:16686"

  pg-backup:
    # Gleiches Image wie der Server = gleiche pg_dump-Version (ein neuerer
    # Server mit älterem pg_dump verweigert den Dump).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-boerdi}
      PGDATABASE: ${POSTGRES_DB:-boerdi}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - pgbackup:/backup
    # Schleife statt cron: das offizielle Postgres-Image bringt keinen
    # Cron-Daemon mit, und ein zweites Image dafür wäre mehr Lieferkette als
    # Nutzen. Preis: der Takt verschiebt sich bei jedem Neustart des
    # Containers — für ein Tagesbackup unerheblich, im Runbook benannt.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f="/backup/boerdi-$$(date +%Y%m%d-%H%M%S).dump"
          if pg_dump -Fc -f "$$f"; then
            echo "backup ok: $$f"
            # Aufräumen NUR nach einer neuen Sicherung: sonst löschten
            # KEEP_DAYS stille Fehlschläge jede gute (Audit 2026-09-29).
            find /backup -name 'boerdi-*.dump' -mtime "+$$KEEP_DAYS" -delete
          else
            echo "BACKUP FEHLGESCHLAGEN" >&2
            rm -f "$$f"
          fi
          sleep 86400
        done

volumes:
  pgdata:
  pgbackup:
  # Paket 11: das selbst bezogene Reranker-Modell (siehe backend.volumes).
  reranker_models:
  traefik-acme:
