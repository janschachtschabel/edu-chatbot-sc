{{- if and .Values.backend.externalName.host .Values.backend.externalName.caBundle }}
# Die Wurzelzertifikate, gegen die der Ingress den Chat-Host prüft (proxy-ssl-secret). Im Namespace
# dieses Releases — ingress-nginx liest Secrets anderer Namespaces nur mit
# --allow-cross-namespace-resources. Nur öffentliche Zertifikate, kein Schlüssel.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boerdi_session.caSecretName" . }}
  labels:
    {{- include "boerdi_session.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ .Values.backend.externalName.caBundle | quote }}
{{- end }}
