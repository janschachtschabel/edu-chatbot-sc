[project]
name = "boerdi-backend"
version = "0.1.0"
description = "boerdi-chat backend: FastAPI + LangGraph orchestration, Postgres 17 + pgvector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    # C6 (2026-07-31): der Fenster-Zähler der Safety-Config-Bremse
    # (services/rate_limits). Kam bisher nur transitiv über slowapi mit — seit
    # wir es direkt importieren, gehört es hierher, sonst hängt unser Code an
    # der Abhängigkeitswahl eines Fremdpakets. MIT, Gate-konform.
    "limits>=5.8.0",
    "litellm>=1.91.1",
    "markitdown>=0.1.6",
    "mcp>=1.28.1",
    "numpy>=2.5.1",
    "onnxruntime>=1.20.1",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
    "opentelemetry-sdk>=1.43.0",
    "pgvector>=0.5.0",
    # C5 (2026-07-31, Nutzer-Entscheid): Ressourcen-Abtastung im Lasttest.
    # ALT nutzte psutil dafür; der Port ließ es weg, weil pyproject.toml außerhalb
    # jenes Slice lag — Folge war ein Feature, das im Studio dokumentiert war und
    # immer leer blieb. BSD-3-Clause, vom Lizenz-Gate (§0 Regel 1) erlaubt.
    "psutil>=7.1.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.51",
    "tokenizers>=0.23.1",
    "uvicorn[standard]>=0.51.0",
    "valkey>=6.1.1",
]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[project.scripts]
boerdi = "boerdi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boerdi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "pg: braucht die Compose-Postgres (deploy/compose.dev.yml, Port 5432)",
    "jaeger: braucht den Compose-Jaeger (deploy/compose.dev.yml, Port 16686/4318)",
    "valkey: braucht den Compose-Valkey (deploy/compose.dev.yml, Port 6379)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Verbatim LLM prompt strings ported 1:1 from ALT: line length is dictated by
# the source prompt text, not style — wrapping would alter the prompt bytes.
"src/boerdi/services/quick_replies_llm.py" = ["E501"]
"src/boerdi/services/quick_replies_prompt.py" = ["E501"]
"src/boerdi/services/llm_learning_path.py" = ["E501"]
"src/boerdi/services/response_prompt_pattern.py" = ["E501"]
"src/boerdi/services/response_prompt_display_blocks.py" = ["E501"]
"src/boerdi/services/response_prompt_tools_text.py" = ["E501"]
"src/boerdi/services/response_tool_selection.py" = ["E501"]
"src/boerdi/services/canvas_service.py" = ["E501"]
# Verbatim security regex assets ported 1:1 from ALT safety_service: the crisis/
# threat/injection patterns must stay on one line (reflowing risks transcription
# errors and the escalation tests pin exact matches).
"src/boerdi/services/safety/regex_gate.py" = ["E501"]
# Verbatim WLO tool-schema descriptions ported 1:1 from ALT mcp_tool_defs: the
# long strings are LLM-facing prompt text — wrapping would alter the bytes the
# model sees when choosing a tool.
"src/boerdi/services/mcp/tool_defs.py" = ["E501"]
# wikipedia_service.py stood here as a byte-for-byte ALT copy. Since 2026-08-01
# its fetch half goes through the MCP tool and was rewritten, so the fidelity
# argument no longer covers the file — and the rewritten lines fit 100 cols.
# Only the relevance heuristic is still verbatim ALT, and its long lines live in
# the test file's parametrize table.
"tests/test_wikipedia_service.py" = ["E501"]
# Verbatim completion-bubble builders ported 1:1 from ALT
# chat_completion_messages.py (pure/offline): one line in the task-count branch
# exceeds 100 cols; reflowing it would diverge the byte-for-byte port (fidelity
# via AST-diff).
"src/boerdi/domain/completion_messages.py" = ["E501"]
# Verbatim canvas material-type registry ported 1:1 from ALT canvas_types.py:
# the _DEFAULT_* structure/alias strings are long by nature (E501). F601 flags
# two duplicate dict-key quirks preserved verbatim from ALT (fidelity via
# AST-diff): _DEFAULT_LRT_TO_MATERIAL_TYPE has a benign redundant
# "themenübersicht"→"struktur" pair, and _DEFAULT_TYPE_ALIASES has a real
# dead-mapping ("übersicht"→"struktur" overridden by a later
# "übersicht"→"factsheet"). Both carried over 1:1 so ALT runtime behaviour is
# reproduced exactly; flagged in the progress log for the user to fix later.
"src/boerdi/domain/canvas/types.py" = ["E501", "F601"]
# Verbatim LP fast-path body ported 1:1 from ALT _route_pattern (Z. 282-597):
# fidelity is proven by an AST-diff against the ALT block, so the source stays
# byte-for-byte with ALT — reflowing the 10 long lines would cosmetically
# diverge it, and adding zip(strict=) would change the AST. The one zip pairs
# arrays built from the same list via asyncio.gather (equal length by
# construction), so B905 is a false positive here.
"src/boerdi/services/lp_fast_path.py" = ["E501", "B905"]
# Verbatim canvas-create fast-path body ported 1:1 from ALT
# _try_canvas_create_fast_path (Z. 243-681): fidelity is proven by an AST-diff
# against the ALT function, so the source stays byte-for-byte with ALT —
# reflowing the one long topic-stripper regex line would cosmetically diverge it.
"src/boerdi/services/canvas_fast_path.py" = ["E501"]
