# Webseiten-Tour — geführte Besucherführung als Konversions-Funnel
# (Domänwissen, Studio-pflegbar)
#
# Steuert die optionale "Web-Tour", die einen Besucher zielgerichtet durch
# WirLernenOnline führt — von der Selbstzuordnung bis zur Anfrage/Kontakt
# auf /mitmachen/. Das VERHALTEN (State Machine, Ankunfts-Erkennung,
# Einstiegspunkt-Erkennung) liegt deterministisch im Backend
# (tour_service.py + chat.py); HIER stehen nur Texte, Ziel-URLs, Gruppen
# und das Gruppe→Angebot-Mapping — alles ohne Deploy redaktionell pflegbar.
#
# ── Funnel (voller Weg ab Startseite, Flow A1/A2/A3) ────────────────
#   intro → (Startseite) group → group_page → (Zielgruppenseite)
#   content → (Bildungsinhalte, kurzer Zwischenstopp) solutions →
#   (relevante Angebote/Produkte) contact → (Mitmachen = Anfrage, Ziel)
#
# ── Einstiegspunkte (Funnel kann MITTEN starten — siehe flows: unten) ─
#   Beim Start prüft tour_service.detect_entry die aktuelle Seite:
#     /home/               → group     (A*: Selbstzuordnung)
#     Zielgruppenseite     → solutions (B1: Gruppe erkannt, direkt zu Lösungen)
#     Produkt/Angebot-Seite→ solutions (C1: Gruppe per Rückwärts-Lookup)
#     /mitmachen/(…)       → contact   (D1/D2: schon am Ziel, nur Prozess-Sicherheit)
#     sonst                → intro     (voller Funnel ab Startseite)
#
# Navigation = "Bring mich hin"-Buttons (1 Klick) via __guide__|Label|URL.
# Pfade werden als {base_host}{path} zu vollen URLs gebaut. Der Vergleich
# "Besucher auf Zielseite?" passiert pfad-basiert (Host egal).
#
# DEPLOYMENT-VORAUSSETZUNGEN (sonst bricht die Ankunfts-/Einstiegs-Erkennung):
#   1. Das Widget muss auf den Tour-Zielseiten SITE-WEIT eingebettet sein —
#      nur dann feuert nach dem Seitenwechsel der unsichtbare Tick, mit dem
#      der Bot die Ankunft erkennt, und nur dann kennt detect_entry beim Start
#      die aktuelle Seite (env.page).
#   2. Session-Persistenz muss an sein (persist-session="true" am Widget bzw.
#      Cookie/?bsid= für Cross-Subdomain), damit die laufende Tour den WP-
#      Full-Page-Reload überlebt.
#   3. base_host muss auf denselben Host zeigen, auf dem das Widget läuft
#      (Test: wp-test…, Prod: https://wirlernenonline.de).

website_tour:
  enabled: true

  # Basis-Host für alle Tour-Links. Umschaltbar Test <-> Prod.
  # Prod: https://wirlernenonline.de
  base_host: "https://wp-test.wirlernenonline.de"

  # Startseite — Ziel von Schritt "intro", Auslöser von Schritt "group".
  home_path: "/home/"

  # Landeseite des Bildungsinhalte-Zwischenstopps.
  content_hub: "/bildungsinhalte/"

  # Konversions-Ziel des Funnels (Anfrage / Mitmachen / Kontakt).
  contact_hub: "/mitmachen/"

  # Frontend-Startbutton-Label (ersetzt einen der 4 festen Startbuttons).
  start_label: "Web-Tour starten"

  # Getippte Auslöser: Enthält die Nutzer-Nachricht eine dieser Phrasen
  # (Teilstring, case-insensitive) UND es läuft KEINE Tour, startet die Tour
  # automatisch — auch mitten im Chat, nicht nur über den Startbutton.
  # Redaktionell pflegbar. Bewusst eindeutige Phrasen, damit normale Suchen
  # ("zeig mir material zu …") die Tour nicht versehentlich auslösen.
  trigger_phrases:
    - "web-tour"
    - "webtour"
    - "Web-tour"
    - "Webtour"
    - "web tour"
    - "tour starten"
    - "starte die tour"
    - "starte eine tour"
    - "mach eine tour"
    - "führ mich rum"
    - "führ mich herum"
    - "fuehre mich"
    - "rundgang"
    - "zeig mir die seite"
    - "zeig mir die website"
    - "wie funktioniert die seite"
    # Englische Auslöser stehen NEBEN den deutschen, nicht statt ihrer: der
    # Erkenner darf die Sprache des Zuges nicht kennen (C1-g2d).
    - "start the tour"
    - "start a tour"
    - "give me a tour"
    - "guided tour"
    - "show me around"
    - "show me the site"
    - "show me the website"
    - "how does this site work"
    - "how does this website work"

  # ── Typische Besucher-Flows (Konzept 4.2) — Grundlage der Einstiege ─
  # Reine Dokumentation/Domänwissen. Die Spalte tour_einstieg sagt, an
  # welchem Schritt die Tour einsteigt, wenn der Besucher schon auf einer
  # solchen Seite ist (umgesetzt in tour_service.detect_entry).
  flows:
    - { id: A1, weg: "Startseite → Zielgruppenseite → Produkt/Angebot → Anfrage", bedeutung: "Klassischer Zielgruppenflow: Selbstzuordnung, Lösung, Anfrage", tour_einstieg: intro }
    - { id: A2, weg: "Startseite → Produkt/Angebot → Anfrage", bedeutung: "Nutzer wissen grob, welches Angebot sie interessiert", tour_einstieg: intro }
    - { id: A3, weg: "Startseite → Lösungsübersicht → Produkt/Angebot → Anfrage", bedeutung: "Nutzer brauchen zuerst Angebotsüberblick", tour_einstieg: intro }
    - { id: B1, weg: "Zielgruppenseite → Produkt/Angebot → Anfrage", bedeutung: "Nutzer landen direkt auf Zielgruppenseite", tour_einstieg: solutions }
    - { id: C1, weg: "Produkt/Angebot → Anfrage", bedeutung: "Nutzer landen direkt auf Produktseite", tour_einstieg: solutions }
    - { id: D1, weg: "Angebots-/Mitmachseite → Anfrage/Formular", bedeutung: "Fast konversionsbereit; Ablenkung reduzieren", tour_einstieg: contact }
    - { id: D2, weg: "Anfrage-Seite → Formular absenden", bedeutung: "Im Abschluss; nur Prozesssicherheit geben", tour_einstieg: contact }

  # Begrüßung + Tour-Erklärung (Schritt "intro", voller Funnel ab Start).
  intro: |
    Schön, dass du da bist! 🎉 Ich zeig dir in ein paar Schritten, was
    WirLernenOnline für **dich** bietet — und bring dich am Ende direkt
    dahin, wo du eine Anfrage stellen oder mitmachen kannst. Los geht's
    auf der Startseite. 👇

  # Leer lassen heißt „nicht gepflegt" — dann zeigt der Bot den deutschen
  # Text, nie eine leere Blase (C1-g2d). Gilt für jedes `*_en` hier.
  intro_en: |
    Great to have you here! 🎉 In a few steps I'll show you what
    WirLernenOnline has for **you** — and at the end I'll take you straight to
    where you can send an enquiry or get involved. Let's start on the home
    page. 👇

  # Sanfter Hinweis, wenn der Besucher mitten in der Tour auf einer
  # unerwarteten Seite landet — der aktuelle Weiter-Button wird erneut angeboten.
  nudge: |
    Du bist gerade woanders unterwegs. Wenn du mit der Tour weitermachen
    möchtest, bring ich dich zum nächsten Halt: 👇

  nudge_en: |
    You're somewhere else at the moment. If you'd like to carry on with the
    tour, I'll take you to the next stop: 👇

  # Re-Show-Text, wenn der Besucher in der Lösungen-Phase eine der
  # verlinkten Seiten öffnet (Ankunft auf einer Explore-Seite).
  explore: |
    Schau dich hier ruhig in Ruhe um. Wenn du bereit für die Anfrage bist,
    geht's weiter: 👇

  explore_en: |
    Feel free to look around here as long as you like. When you're ready for
    the enquiry, we'll move on: 👇

  # ── Einstiegs-Texte (Funnel startet mitten drin, B1/C1) ─────────────
  # Wird gezeigt, wenn der Besucher die Tour NICHT auf der Startseite
  # startet, sondern schon auf einer Zielgruppen- oder Produktseite.
  entry:
    solutions: |
      Schön, du bist schon mitten drin bei WLO! 🎉 Dann steigen wir direkt
      hier ein — kein Grund, von vorn anzufangen. Das sind die für dich
      passenden Lösungen; schau dir eine an, danach bring ich dich direkt
      zur Anfrage. 👇

    solutions_en: |
      You're already right in the middle of WLO! 🎉 So let's pick up
      here — no need to start from the beginning. These are the solutions that
      fit you; take a look at one, then I'll take you straight to the
      enquiry. 👇

  # ── Besucher-Gruppen ──────────────────────────────────────────────
  # label   = Quick-Reply-Button + Anzeige
  # synonyms = zusätzliche Freitext-Treffer (lowercase, Teilstring-Match)
  # page     = Zielgruppenseite (Pfad) — Einstiegspunkt B1
  # angebote = relevante /angebote/-Seiten (Produkte/Lösungen) — Einstiegspunkt C1
  groups:
    - id: redaktionen
      label: "Redaktionen"
      label_en: "Editorial teams"
      synonyms: ["redaktion", "redaktionen", "redakteur", "redakteurin", "kuratieren", "kuratierung", "metadaten pflegen"]
      page: "/home/redaktionen/"
      angebote:
        - { label: "WLO-Redaktionssoftware", label_en: "WLO editorial software", path: "/angebote/wlo-redaktionssoftware/" }
        - { label: "Redaktionelle Arbeiten", label_en: "Editorial services", path: "/angebote/redaktionelle-arbeiten/" }
        - { label: "Metadaten verbessern lassen", label_en: "Metadata improvement", path: "/angebote/metadaten-verbessern-lassen/" }

    # Presse/Journalist:innen (zweite Hälfte von P-RED) — wollen Hintergrund,
    # Zahlen, Kontakt; NICHT die Redaktionssoftware. Eigener Button → "Über WLO".
    - id: presse
      label: "Presse"
      label_en: "Press"
      synonyms: ["presse", "journalist", "journalistin", "journalist:in", "pressevertreter", "pressevertreterin", "medien", "medienvertreter", "pressekontakt", "pressemitteilung", "berichterstattung"]
      page: "/mitmachen/ueber-wlo/"
      angebote:
        - { label: "Über WLO", label_en: "About WLO", path: "/mitmachen/ueber-wlo/" }
        - { label: "FAQ", label_en: "FAQ", path: "/mitmachen/faq/" }

    - id: contentanbieter
      label: "Contentanbieter"
      label_en: "Content providers"
      synonyms: ["content anbieter", "contentanbieter", "anbieter", "verlag", "produzent", "material anbieten", "inhalte anbieten", "inhalte bereitstellen"]
      page: "/home/contentanbieter/"
      angebote:
        - { label: "WLO-Inhalte für deine Suchmaschine", label_en: "WLO content for your search engine", path: "/angebote/wlo-inhalte-fuer-deine-suchmaschine/" }
        - { label: "Automatisierte Quellenerschließung", label_en: "Automated source indexing", path: "/angebote/automatisierte-quellenerschliessung/" }
        - { label: "Metadaten verbessern lassen", label_en: "Metadata improvement", path: "/angebote/metadaten-verbessern-lassen/" }

    - id: abnehmer
      label: "Content-Abnehmer"
      label_en: "Content consumers"
      # "lehrkraft" bewusst NICHT mehr hier — einzelne Lehrkräfte haben eine
      # eigene Gruppe (lehrkraft). "Content-Abnehmer" = Institutionen/Plattformen,
      # die WLO-Inhalte technisch beziehen. "schule" bleibt (Schule als Träger).
      synonyms: ["abnehmer", "content abnehmer", "inhalte nutzen", "inhalte beziehen", "lernplattform", "schule", "nutze inhalte"]
      page: "/home/abnehmer-bildungs-und-wissensinhalte/"
      angebote:
        - { label: "Integrationen für Lernplattformen & Web-CMS", label_en: "Integrations for learning platforms & web CMS", path: "/angebote/integrationen-fuer-lernplattformen-und-web-cms/" }
        - { label: "Bildungs-API", label_en: "Education API", path: "/angebote/bildungs-api/" }
        - { label: "WLO-Inhalte für deine Suchmaschine", label_en: "WLO content for your search engine", path: "/angebote/wlo-inhalte-fuer-deine-suchmaschine/" }

    # ── Direkt-Nutzer:innen (Chatbot-Kernzielgruppen) ─────────────────
    # Lehrkräfte und Lernende sind auf der Website KEINE eigene Funnel-
    # Sektion — sie gehören inhaltlich zur OER-Community und landen daher
    # auf deren Seite. Eigene Buttons machen sie aber sichtbar wählbar und
    # erlauben gezieltere Angebote (Inhalte entdecken statt B2B-Produkte).
    - id: lehrkraft
      label: "Lehrkraft"
      label_en: "Teachers"
      synonyms: ["lehrkraft", "lehrer", "lehrerin", "lehrer:in", "lehrende", "lehrende:r", "ich unterrichte", "unterrichte", "für meinen unterricht", "für meine klasse", "unterrichtsmaterial", "als lehrer", "als lehrerin", "als lehrkraft"]
      page: "/home/oer-community/"
      angebote:
        - { label: "Fachportale", label_en: "Subject portals", path: "/fachportale/" }
        - { label: "Bildungsinhalte entdecken", label_en: "Discover educational content", path: "/bildungsinhalte/" }
        - { label: "Was ist OER?", label_en: "What is OER?", path: "/bildungsinhalte/oer/" }

    - id: lernende
      label: "Lernende"
      label_en: "Learners"
      synonyms: ["lernende", "lernende:r", "lernender", "lernend", "schüler", "schülerin", "schüler:in", "schueler", "student", "studentin", "studierende", "ich lerne", "fürs lernen", "für die schule lernen", "azubi"]
      page: "/home/oer-community/"
      angebote:
        - { label: "Fachportale", label_en: "Subject portals", path: "/fachportale/" }
        - { label: "Bildungsinhalte entdecken", label_en: "Discover educational content", path: "/bildungsinhalte/" }
        - { label: "Was ist OER?", label_en: "What is OER?", path: "/bildungsinhalte/oer/" }

    - id: eltern
      label: "Eltern"
      label_en: "Parents"
      synonyms: ["eltern", "elternteil", "mutter", "vater", "mein kind", "meine tochter", "mein sohn", "für mein kind", "erziehungsberechtigt", "zuhause lernen", "hausaufgaben", "nachhilfe"]
      page: "/home/oer-community/"
      angebote:
        - { label: "Fachportale", label_en: "Subject portals", path: "/fachportale/" }
        - { label: "Bildungsinhalte entdecken", label_en: "Discover educational content", path: "/bildungsinhalte/" }
        - { label: "Was ist OER?", label_en: "What is OER?", path: "/bildungsinhalte/oer/" }

    - id: oer-community
      label: "OER-Community"
      label_en: "OER community"
      synonyms: ["oer", "community", "oer community", "freie bildungsmaterialien", "ehrenamt", "mitmachen", "open educational resources"]
      page: "/home/oer-community/"
      angebote:
        - { label: "Redaktionelle Arbeiten", label_en: "Editorial services", path: "/angebote/redaktionelle-arbeiten/" }
        - { label: "Think Tank", label_en: "Think tank", path: "/angebote/think-tank/" }

    - id: software-betreiber
      label: "Infrastruktur-Betreiber"
      label_en: "Infrastructure operators"
      synonyms: ["infrastruktur-betreiber", "infrastrukturbetreiber", "infrastruktur betreiben", "betreibe infrastruktur", "software betreiber", "betreiber", "plattform betreiben", "hosting", "betrieb", "betreibe software"]
      page: "/home/software-betreiber/"
      angebote:
        - { label: "Integrationen für Lernplattformen & Web-CMS", label_en: "Integrations for learning platforms & web CMS", path: "/angebote/integrationen-fuer-lernplattformen-und-web-cms/" }
        - { label: "Bildungs-API", label_en: "Education API", path: "/angebote/bildungs-api/" }
        - { label: "Souveränes KI-Ökosystem", label_en: "Sovereign AI ecosystem", path: "/angebote/souveraenes-ki-oekosystem/" }

    - id: software-hersteller
      label: "Entwickler"
      label_en: "Developers"
      synonyms: ["entwickler", "entwicklerin", "entwickler:in", "developer", "software entwickeln", "entwickle software", "programmierer", "programmiererin", "services", "ki für bildung", "bildungsinfrastruktur mitgestalten", "software hersteller", "hersteller"]
      page: "/home/bildungsinfrastruktur-mitgestalten/"
      angebote:
        - { label: "Bildungs-API", label_en: "Education API", path: "/angebote/bildungs-api/" }
        - { label: "Souveränes KI-Ökosystem", label_en: "Sovereign AI ecosystem", path: "/angebote/souveraenes-ki-oekosystem/" }
        - { label: "Integrationen für Lernplattformen & Web-CMS", label_en: "Integrations for learning platforms & web CMS", path: "/angebote/integrationen-fuer-lernplattformen-und-web-cms/" }

    - id: politik
      label: "Politik / Rahmensetzer"
      label_en: "Policy makers"
      synonyms: ["politik", "rahmensetzer", "ministerium", "verwaltung", "rahmen setzen", "bildungspolitik", "förderung", "entscheider", "schulträger", "schulleitung", "schulamt", "kommune", "landkreis", "träger"]
      page: "/home/wlo-fuer-politik/"
      angebote:
        - { label: "Souveränes KI-Ökosystem", label_en: "Sovereign AI ecosystem", path: "/angebote/souveraenes-ki-oekosystem/" }
        - { label: "Think Tank", label_en: "Think tank", path: "/angebote/think-tank/" }
        - { label: "Bildungs-API", label_en: "Education API", path: "/angebote/bildungs-api/" }

  # ── Bildungsinhalte-Sublinks (Schritt "solutions", zum Stöbern) ─────
  content_sublinks:
    - { label: "Fachportale", label_en: "Subject portals", path: "/fachportale/" }
    - { label: "OER-Statistik", label_en: "OER statistics", path: "/bildungsinhalte/oer-statistik/" }
    - { label: "Datenquellen", label_en: "Data sources", path: "/bildungsinhalte/datenquellen/" }
    - { label: "Was ist OER?", label_en: "What is OER?", path: "/bildungsinhalte/oer/" }

  # ── Kontakt-/Anfrage-Links (Schritt "contact" = Konversions-Ziel) ───
  # Bewusst knapp halten (D1: Ablenkung reduzieren).
  contact_links:
    - { label: "Über WLO", label_en: "About WLO", path: "/mitmachen/ueber-wlo/" }
    - { label: "FAQ", label_en: "FAQ", path: "/mitmachen/faq/" }

  # ── Schritt-Texte ───────────────────────────────────────────────────
  # Platzhalter {group} wird durch das gewählte Gruppen-Label ersetzt.
  steps:
    intro:
      nav_label: "Zur Startseite"
      nav_label_en: "To the home page"

    group:
      text: |
        Du bist auf der **Startseite**. 👇 Weiter unten stellen wir die
        verschiedenen Besucher-Gruppen vor — du kannst dich aber auch direkt
        hier einordnen. Damit ich dir die passenden Angebote zeigen kann:
        Als was bist du gerade unterwegs?
      text_en: |
        You're on the **home page**. 👇 Further down we introduce the
        different visitor groups — but you can also place yourself right here.
        So I can show you the offers that fit: what brings you here today?
      unsure_label: "Bin mir nicht sicher"
      unsure_label_en: "I'm not sure"
      unsure_text: |
        Kein Problem! Sag mir einfach grob, was dich zu WLO führt — zum
        Beispiel „ich suche Material", „ich biete Inhalte an" oder „ich
        entwickle Software" — dann ordne ich dich passend ein.
      unsure_text_en: |
        No problem! Just tell me roughly what brings you to WLO — for example
        "I'm looking for material", "I offer content" or "I develop software" —
        and I'll place you accordingly.

    group_page:
      text: |
        Super — **{group}**. Ich bring dich direkt zu eurer Seite, dort ist
        alles für euch zusammengefasst. 👇
      text_en: |
        Great — **{group}**. I'll take you straight to your page, where
        everything is gathered for you. 👇
      nav_label: "Zur Seite für {group}"
      nav_label_en: "To the page for {group}"

    content:
      text: |
        Kurzer Zwischenstopp: Hier siehst du, woher die Bildungsinhalte auf
        WLO kommen — Fachportale, Datenquellen und ein paar Zahlen aus der
        OER-Statistik. Schau rein, dann geht's zu den Lösungen für **{group}**. 👇
      text_en: |
        A quick stop: here you can see where the educational content on WLO
        comes from — subject portals, data sources and a few figures from the
        OER statistics. Have a look, then we'll go on to the solutions for
        **{group}**. 👇
      nav_label: "Zu den Bildungsinhalten"
      nav_label_en: "To the educational content"

    solutions:
      text: |
        Das sind die für **{group}** besonders relevanten Lösungen. Schau dir
        eine in Ruhe an — und wenn etwas passt, bring ich dich direkt zur
        Anfrage. 👇
      text_en: |
        These are the solutions that are particularly relevant for **{group}**.
        Take your time with one — and if something fits, I'll take you straight
        to the enquiry. 👇
      sublinks_label: "Mehr zu den Inhalten"
      sublinks_label_en: "More about the content"
      angebote_label: "Für {group} besonders relevant"
      angebote_label_en: "Particularly relevant for {group}"
      nav_label: "Weiter zur Anfrage"
      nav_label_en: "On to the enquiry"

    contact:
      text: |
        Fast geschafft! 🎯 Hier auf der **Mitmach-Seite** kannst du deine
        Anfrage stellen oder direkt Kontakt aufnehmen — alles Wichtige dazu
        findest du hier, ganz unkompliziert. Danke fürs Mitkommen — und meld
        dich jederzeit, wenn noch etwas offen ist!
      text_en: |
        Almost there! 🎯 Here on the **get-involved page** you can send
        your enquiry or get in touch directly — everything that matters is
        right here, no fuss. Thanks for coming along — and get in touch any
        time if anything is still open!
      links_label: "Das brauchst du noch"
      links_label_en: "You might still need this"
