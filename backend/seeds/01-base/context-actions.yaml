# Kontext-Aktionen (Studio-pflegbar) — Begrüßung + Aktions-Pills, die der
# Chatbot proaktiv anbietet, wenn er auf einer Sammlungs-, Inhalts- oder
# Themenseite eingebettet ist. Backend-getrieben: das Widget rendert nur
# content + quick_replies. Änderungen wirken live (mtime-Cache).
#
# Pill-kinds:
#   action  -> Direct-Action-Pill (encodiert als __action__|Label|action|params)
#   text    -> sendet das Label als normale Nachricht (Normalfluss)
#   report  -> Guide-Link-Pill (__guide__|Label|report_url) zum Melden
context_actions:
  enabled: true

  # {node_id} / {collection_id} werden vom Dispatcher ersetzt. Der Param ist
  # unschädlich, falls die WLO-Formularseite ihn (noch) nicht auswertet.
  report_url: "https://wirlernenonline.de/mitmachen/inhalt-vorschlagen/?type=quelle&node={node_id}#esform"

  # Unsere eigenen Seiten. Exakte Hostnamen oder `*.example.com`; `www.`, Port
  # und Groß-/Kleinschreibung spielen keine Rolle. Nur wirksam, wenn der
  # URL-Erkenner die Seite NICHT einordnen konnte — eine erkannte Sammlung
  # bleibt eine Sammlung, auch auf einem eigenen Host.
  #
  # Die Repository-Hosts gehören zwingend dazu, nicht nur die WordPress-Seiten:
  # dort gibt es Seiten, die auf kein Muster passen (z.B.
  # /edu-sharing/components/workspace). Ohne sie böte der Bot an, eine
  # WLO-eigene Seite „in WLO aufzunehmen". Leere Liste = alles gilt als fremd.
  own_hosts:
    - wirlernenonline.de
    # X1 (2026-08-20): der bare Eintrag matcht exakt — die Test-Instanz
    # wp-test.wirlernenonline.de galt als fremd, und der Bot bot am Tour-Ende
    # an, die eigene Mitmach-Seite „in WLO aufzunehmen".
    - "*.wirlernenonline.de"
    - wissenlebt.online
    - repository.staging.openeduhub.net
    - redaktion.openeduhub.net

  # {title} wird durch den Seitentitel ersetzt — er muss in BEIDEN Fassungen
  # stehen, sonst grüßt der Bot, ohne zu sagen, wo der Nutzer gerade ist.
  greetings:
    # {bestand} = Kontext-Bestätigung in Zahlen (services/context_facts).
    # Leer, wenn keine Zahl rechtzeitig da war — der Abstand steht IM Satz.
    collection: "Du bist gerade in der Sammlung „{title}“.{bestand} Womit kann ich helfen?"
    content: "Du schaust dir gerade „{title}“ an. Ich kann Fragen dazu beantworten — oder direkt:"
    topic: "Du bist auf der Themenseite „{title}“.{bestand} Womit kann ich helfen?"
    # Diese drei Arten sind KEIN WLO-Objekt — es gibt keinen Knoten mit einem
    # Titel. Ihr Platzhalter heißt deshalb {query} bzw. {host}; {title} bliebe
    # hier als Text stehen.
    search: "Du siehst gerade die Treffer zu „{query}“. Ich kann die Suche verfeinern oder etwas dazu erklären."
    home: "Du befindest Dich auf {host}. Womit fangen wir an?"
    external: "Du bist auf {host} — das gehört nicht zu WLO. Ich kann mir die Seite ansehen und sie für den Bestand vorschlagen."
    # EK2 (2026-08-20): Erschließung im Prüftisch (editorial-desk). KEIN
    # {title} — der Knoten unter Erschließung ist für den anonymen Zugriff
    # regelmäßig nicht lesbar (403, unveröffentlicht), und genau dann soll
    # der Gruß sprechen. Gegenstand ist die Situation, nicht der Titel.
    editorial: "Du erschließt gerade einen Einzelinhalt. Ich kann Hinweise zum Inhalt geben, eine passende Sammlung suchen oder beim Kuratieren helfen."

  # Englische Fassung (C1-g2b). Leer lassen heißt „nicht gepflegt" — dann
  # zeigt der Bot die deutsche Fassung, nie einen leeren Gruß.
  greetings_en:
    collection: "You are in the “{title}” collection.{bestand} How can I help?"
    content: "You are looking at “{title}”. I can answer questions about it — or go straight to:"
    topic: "You are on the “{title}” topic page.{bestand} How can I help?"
    search: "You are looking at the results for “{query}”. I can narrow the search down or explain something about it."
    home: "You are on {host}. Where shall we start?"
    external: "You are on {host} — that is outside WLO. I can look at the page and suggest it for the collection."
    editorial: "You are cataloguing a single content item. I can give pointers on the content, find a fitting collection, or help with curation."

  # label_en ist bei `kind: text` KEINE reine Anzeige: der Klick sendet die
  # Beschriftung als Nachricht. Sie muss deshalb in der Sprache des Nutzers
  # stehen — sonst schickt ein englischer Nutzer deutschen Text.
  #
  # Nutzer-Vorgabe 2026-08-13, eine Liste je Seitenart. Zwei Zeilen darin sind
  # KEINE Geschmacksfrage — beide beim Bauen nachgemessen
  # (``tests/test_context_action_pills.py`` hält sie fest):
  #
  # * „Stunde planen" heisst NICHT „Unterrichtsstunde planen". „unterrichtsstunde"
  #   steht in ``lp_intent._lp_keywords``, geprüft wird auf Teilzeichenkette, und
  #   der Lernpfad-Schnellweg läuft VOR der Musterwahl. Der Chip käme also nie
  #   bei M09 an — und damit nie bei der Freigabeliste der Sammlung, die P1/P2
  #   gerade erst dorthin gebracht haben. „Stunde planen" ist zugleich der
  #   wörtliche Titel des Skills.
  # * „Webseiten-Tour starten" enthält „tour starten" aus `website-tour.yaml`.
  #   Dort entscheidet kein Klassifikator, sondern ein harter Phrasenvergleich;
  #   die englische Fassung trägt „web tour" aus demselben Grund.
  pills:
    collection:
      - { label: "Sammlungsinhalte zeigen",     label_en: "Show collection contents", kind: action, action: browse_collection }
      - { label: "Stunde planen",               label_en: "Plan a lesson",            kind: text }
      - { label: "Sammlung kuratieren",         label_en: "Curate collection",        kind: action, action: curate_collection }
      - { label: "Zu Lehrplänen beraten",       label_en: "Advise on the curriculum", kind: text }
      - { label: "Inhalt melden",               label_en: "Report content",           kind: report }
    content:
      - { label: "Mehr Details zeigen",         label_en: "Show more details",        kind: text }
      - { label: "Volltext abrufen und bearbeiten", label_en: "Open the full text",   kind: action, action: show_content_text }
      - { label: "Inhalte remixen",             label_en: "Remix this content",       kind: text }
      - { label: "Ähnliche Inhalte suchen",     label_en: "Find similar content",     kind: text }
      - { label: "Inhalt melden",               label_en: "Report content",           kind: report }
    topic:
      - { label: "Themenseiteninhalte zeigen",  label_en: "Show topic page contents", kind: action, action: browse_collection }
      - { label: "Stunde planen",               label_en: "Plan a lesson",            kind: text }
      - { label: "Sammlung kuratieren",         label_en: "Curate collection",        kind: action, action: curate_collection }
      - { label: "Zu Lehrplänen beraten",       label_en: "Advise on the curriculum", kind: text }
      - { label: "Inhalt melden",               label_en: "Report content",           kind: report }
    search:
      - { label: "Videos zum Thema",            label_en: "Videos on this topic",     kind: text }
      - { label: "Arbeitsblätter zum Thema",    label_en: "Worksheets on this topic", kind: text }
    home:
      - { label: "Informiere mich über WLO",    label_en: "Tell me about WLO",        kind: text }
      - { label: "Webseiten-Tour starten",      label_en: "Start the web tour",       kind: text }
      - { label: "Inhalte finden",              label_en: "Find content",             kind: text }
      - { label: "Kontakt und mitmachen",       label_en: "Contact and get involved", kind: text }
    # WÖRTLICH aus M20s `trigger_phrases`. Die Beschriftung eines `text`-Chips
    # IST die gesendete Nachricht: sie muss das Erschliessungs-Muster auslösen,
    # nicht nur gut klingen. Eine frei formulierte Zeile wäre eine Schaltfläche,
    # die nichts tut. `action` scheidet aus — es gibt keine Direkt-Aktion fürs
    # Erschliessen, der Weg führt über M20.
    external:
      - { label: "Nimm diese Seite in WLO auf", label_en: "Add this page to WLO",     kind: text }
      - { label: "Was steht auf der Seite, und passt das zu uns", label_en: "What is on this page, and does it fit us", kind: text }
    # EK2 (2026-08-20): die drei bestellten Erschließungs-Angebote — Hinweise
    # zum Inhalt, Sammlungs-Suche, Kuratierungshilfe. Alles `text`: es gibt
    # keine Direkt-Aktion fürs Erschließen, und die Beschriftung IST die
    # gesendete Nachricht; Node-ID + sichtbarer Seitentext stehen im
    # Seitenblock des Prompts (EK1).
    editorial:
      - { label: "Gib mir Hinweise zu diesem Inhalt", label_en: "Give me pointers on this content", kind: text }
      - { label: "Such eine passende Sammlung für diesen Inhalt", label_en: "Find a fitting collection for this content", kind: text }
      - { label: "Hilf mir beim Erschließen dieses Inhalts", label_en: "Help me catalogue this content", kind: text }

  # Zweite Lesart von `external`: die Dublettenprüfung hat die Seite im Bestand
  # gefunden. Dann darf der Bot das Aufnehmen NICHT anbieten — ein zweiter
  # Datensatz zur selben Adresse ist die häufigste vermeidbare Verschmutzung
  # (M20, Schritt 2). {title} ist der Titel des GEFUNDENEN Eintrags.
  # Keine eigene Seitenart: sonst könnte ein Widget sie als page_kind senden.
  duplicate_greeting: "Diese Seite gibt es in WLO schon: „{title}“."
  duplicate_greeting_en: "This page is already in WLO: “{title}”."
  duplicate_pill_label: "Den vorhandenen Eintrag ansehen"
  duplicate_pill_label_en: "Open the existing entry"

  # Anweisung für die Kuratier-Aktion (Soll-vs-Ist-Abgleich).
  curate_prompt: |
    Das Kompendium beschreibt, was die Sammlung inhaltlich abdecken SOLL. Die
    Inhaltsliste zeigt, was IST. Nenne konkret: (1) gut abgedeckte Kernthemen,
    (2) Lücken (im Kompendium beschrieben, aber ohne passenden Inhalt),
    (3) je Lücke einen konkreten Suchvorschlag.
