# Preistafel fuer die Kostenueberwachung (K3)
#
# Preise stehen je 1 MIO. TOKEN, so wie die Anbieter sie ausweisen.
#
# Der Schluessel ist der Modellname, wie ihn der Anbieter in der ANTWORT
# meldet (resp.model) — nicht der in LLM_CHAT_MODEL konfigurierte Alias.
# Meldet der Anbieter eine Version (gpt-5.4-mini-2026-03-01), genuegt der
# Kurzname: gesucht wird erst exakt, dann der laengste passende Praefix.
#
# Werksfassung (Nutzer-Entscheid 2026-10-18): die OpenAI-Listenpreise, Stufe
# "Standard", kurzer Kontext, in US-Dollar wie bei OpenAI — nicht umgerechnet.
# Nicht abgebildet sind Cache-Schreibpreise und der teurere lange Kontext; die
# Betraege sind darum eine Schaetzung nach Liste, keine Rechnung. Ueber die
# b-api oder die AcademicCloud kann anders abgerechnet werden — dann die Tafel
# im Studio (Kosten -> Preistafel) anpassen. Preise aendern sich: vor einer
# Kostenaussage mit der Liste des Anbieters abgleichen.
#
# 0,0 ueberall heisst "nicht gepflegt", NICHT "kostenlos": die Auswertung meldet
# dann ausdruecklich, dass kein Preis hinterlegt ist. Ohne Cache-Rabatt
# (Liste "-") steht cached_input auf dem Eingabepreis.

currency: USD

models:
  # Vorgabe-Modell des Chats (LLM_CHAT_MODEL) und der Auswertung.
  gpt-6-luna:
    input: 0.10
    cached_input: 0.01
    output: 0.50
  gpt-6-sol:
    input: 2.00
    cached_input: 0.20
    output: 10.00
  gpt-6.1-sol:
    input: 2.00
    cached_input: 0.10
    output: 10.00
  gpt-6-astra:
    input: 10.00
    cached_input: 1.00
    output: 50.00
  gpt-5.6-luna:
    input: 0.20
    cached_input: 0.02
    output: 1.20
  gpt-5.6-terra:
    input: 2.00
    cached_input: 0.20
    output: 12.00
  gpt-5.6-sol:
    input: 4.00
    cached_input: 0.40
    output: 20.00
  gpt-5.5:
    input: 5.00
    cached_input: 0.50
    output: 30.00
  gpt-5.5-pro:
    input: 30.00
    cached_input: 30.00
    output: 180.00
  gpt-5.4:
    input: 2.50
    cached_input: 0.25
    output: 15.00
  gpt-5.4-pro:
    input: 30.00
    cached_input: 30.00
    output: 180.00
  # Nicht in der Liste vom 2026-10-18 — bleiben ungepflegt, bis jemand den Preis
  # des Anbieters eintraegt.
  gpt-5.4-mini:
    input: 0.0
    cached_input: 0.0
    output: 0.0
  # Nur noch noetig, wenn EVAL_SIMULATOR_MODEL / EVAL_JUDGE_MODEL es setzen —
  # seit Paket 7 laufen Simulator und Bewerter ohne Angabe mit dem Chat-Modell.
  # Die Kostenschaetzung der Auswertung bepreist mit dieser Tafel (in ihrer
  # Waehrung, ohne Umrechnung); fehlt ein Preis, nennt sie das Modell.
  gpt-4o-mini:
    input: 0.0
    cached_input: 0.0
    output: 0.0
