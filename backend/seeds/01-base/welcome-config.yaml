# Begrüßung & Start-Quick-Replies (Studio-pflegbar)
# Verwaltet über das Studio — Änderungen wirken live (mtime-Cache).
#
# W12 (EU AI Act Art. 50, 2026-08-09): die Begrüßung sagt ausdrücklich, dass
# hier keine Person antwortet. Die Verordnung verlangt, dass Nutzer das beim
# ERSTEN Kontakt erfahren — die Begrüßung ist genau dieser Moment. Zusätzlich
# steht unter jeder Bot-Antwort „KI-generierte Antwort" (`chat.aiGenerated`),
# damit die Angabe auch beim Zurückscrollen und beim Wiedereinstieg sichtbar
# bleibt. Wer den Text hier im Studio ändert, darf den Satz nicht wegkürzen.
#
# C1-g1a: die englische Fassung steht als `*_en` neben dem deutschen Feld.
# Leer lassen heißt „nicht gepflegt" — dann zeigt das Widget je Schlüssel den
# deutschen Text. Der Tour-Chip wird über `tour_reply` per TEXT verglichen,
# nicht über die Position: `tour_reply_en` muss deshalb wörtlich einem Eintrag
# aus `quick_replies_en` entsprechen.

welcome:
  greeting: |-
    Hey, schön dass du da bist! Ich bin Boerdi, die schlaue Eule von WissenLebtOnline.
    Ich kann dir zeigen, wie du deine Wissens- oder Lerninhalte ins KI-Zeitalter bringst? Oder ich kann dir helfen vorhandene Inhalte in unserer Datenbasis zu finden.
    Damit du es weißt: Ich bin kein Mensch, sondern ein KI-Assistent. Meine Antworten sind KI-generiert und können Fehler enthalten.
  quick_replies:
  - Wie bringe ich meine Inhalte ins KI-Zeitalter?
  - Ich suche Inhalte zu einem Thema.
  - Führe mich systematisch durch die Webseite.
  - Was ist WissenLebtOnline?
  tour_reply: Führe mich systematisch durch die Webseite.

  greeting_en: |-
    Hey, great to have you here! I am Boerdi, the clever owl of WissenLebtOnline.
    I can show you how to bring your knowledge or learning content into the age of AI. Or I can help you find existing content in our database.
    So you know: I am not a human, I am an AI assistant. My answers are AI-generated and can contain mistakes.
  quick_replies_en:
  - How do I bring my content into the age of AI?
  - I am looking for content on a topic.
  - Guide me through the website step by step.
  - What is WissenLebtOnline?
  tour_reply_en: Guide me through the website step by step.
