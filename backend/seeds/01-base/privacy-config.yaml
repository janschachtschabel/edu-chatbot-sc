# Privacy-Konfiguration (Datenschutz)
# Verwaltet ueber das Studio — Aenderungen wirken live
# (mtime-Cache-Invalidation auf Write).

logging:
  messages: true
  memory: true
  quality: true
  # Welle E v4+12 (Sprint K, 2026-05-27): routing-rules / shadow_router
  # komplett entfernt. ``rules``-Toggle daher obsolet — Eintrag entfernt.
  # safety is hardcoded ON in code — this value is informative only.
  safety: true
  # Paket 8 (Nutzer 2026-10-09): Gespraechsverlaeufe — Nachrichten und
  # Sitzungsgedaechtnis — nach so vielen Tagen loeschen (Lauf alle 6 Stunden,
  # services/aufbewahrung.py); 0 = unbegrenzt. Sitzungen und ihre
  # Verbrauchszahlen bleiben.
  retention_days: 30
