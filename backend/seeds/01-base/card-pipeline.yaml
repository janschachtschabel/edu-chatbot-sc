# Card-Pipeline v2 — Treffer-Beschaffung und -Anzeige.
# Aktiv bei Env CARD_PIPELINE_V2; sonst v1-Pfad.

card_pipeline:
  pool_size: 20              # MCP-Pool je Suche (5..50)
  llm_curation_pool: 15      # an LLM für Re-Auswahl (<= pool_size)
  final_selection_size: 5    # an User gezeigt (1..10)
  enable_llm_curation: true  # false = rein deterministisch sortiert
  min_displayed_cards: 5     # min. nach LLM-Auswahl (0 = kein Auffüllen)

  # Welches Repositorium dieser Chatbot bedient.
  # Leer = die Umgebungsvariable REPO_BASE_URL gilt (Vorgabe: Produktion).
  # Gesetzt gewinnt dieser Wert — damit im Studio nachlesbar ist, gegen welches
  # Repositorium der Bot laeuft, statt es aus der Deploy-Umgebung zu erraten.
  # Staging: https://repository.staging.openeduhub.net
  # Der aktuell geltende Wert steht in GET /api/health unter "repo".
  repo_base_url: ""

  # Hosts, deren Links auf das Repositorium oben umgeschrieben werden
  # (verteidigt gegen MCP-Server mit hardcoded Hosts).
  known_repo_hosts:
    - https://redaktion.openeduhub.net
    - https://repository.staging.openeduhub.net
    - https://repository.openeduhub.net
