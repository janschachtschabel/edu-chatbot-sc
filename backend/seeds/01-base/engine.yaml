# Welche Maschine einen Zug beantwortet.
#
#   pattern  Der Bestand: Klassifikator, Musterwahl, gebundene Werkzeugliste.
#   agent    Eine freie Werkzeugschleife — Systemprompt plus voller Katalog,
#            kein Muster, kein Klassifikator. Fuer Einbettungen ohne Chat-Rahmen
#            und als Versuchsaufbau fuer die Frage, ob sie im Chat besser ist.
#
# `hybrid` (die Schleife mit dem Musterkatalog als Werkzeug) ist seit K1-1
# (2026-09-27) entfernt: die K0-Messung zeigte ihn zwischen den beiden anderen,
# ohne eigenen Mehrwert. Ein gespeichertes `hybrid` wird als `agent` gelesen.
#
# Die Vorgabe ist `agent` (Nutzer-Entscheid 2026-10-09, folgt D-15: im Betrieb
# ist die Agent-Schleife die Vorgabe; Krise und Bedrohung beantwortet weiter die
# Muster-Maschine). Je Anlage im Studio umschaltbar, je Anfrage mit der Kopfzeile
# `X-Boerdi-Engine` — das braucht der A/B-Lauf, der alle Maschinen in EINEM
# Golden-Durchgang fahren muss.
mode: agent

# Die Deckel der Agent-Schleife.
agent:
  # Deckel der Schleife. Alle vier sind noetig, weil ein MCP-Aufruf gemessen bis
  # 23 s steht: ohne Frist koennte ein Lauf mit 20 Iterationen zehn Minuten
  # dauern, ohne Budget beliebig viel kosten.
  #
  # 2026-08-18 gemeinsam angehoben (Nutzer-Entscheid): 12/90/60000 -> 20/300/400000.
  # GEMEINSAM, weil jeder Wert allein wirkungslos gewesen waere — welcher Deckel
  # zuerst greift, entscheidet die Messung und nicht die Absicht:
  #
  #   * Das Budget zaehlt prompt+completion KUMULATIV, und weil die Kette
  #     waechst, wird der Prompt jede Runde neu berechnet. Gemessen lag ein
  #     Hybrid-Zug bei ~15 300 Token je Runde. Mit 60000 war nach vier Runden
  #     Schluss — gemessen am 2026-08-17, mitten in einem Lauf, der sein
  #     Ergebnis schon abgeliefert hatte und die Antwort nicht mehr schrieb.
  #   * Mit `deadline_s: 90` waeren 20 Runden ebenso nie erreicht worden: eine
  #     Runde kostet Modellzeit plus bis zu 23 s Werkzeug.
  #
  # Der Preis steht hier, damit ihn niemand suchen muss: der Kosten-Deckel je
  # Zug steigt auf das Sechsfache von 60000. Wer das kleiner braucht, stellt es
  # im Studio je Anlage ein.
  # 2026-08-18, zweite Anhebung am selben Tag (Nutzer-Entscheid):
  # 20/300/400000 -> 30/900/900000. Vorgabe war „bis zu 30 Zuege am Stueck";
  # Frist und Budget wandern mit, sonst greift einer von ihnen vorher und die
  # 30 sind Zierde. Rechnung: gemessen ~15 300 Token je Runde, und die Kette
  # waechst — 30 Runden landen grob bei 700-800k; 900000 laesst Luft, ohne den
  # Deckel wirkungslos zu machen.
  #
  # WAS DIESE DECKEL NICHT LOESEN: das Widget bricht nach 90 s OHNE Ereignis ab
  # (`stream-client.ts`, idleMs 90_000). Nicht die Gesamtdauer zaehlt, sondern
  # die Stille zwischen zwei Fortschritts-Ereignissen — ein langsamer
  # LLM-Aufruf (LLM_READ_TIMEOUT 75 s) plus ein langsames Werkzeug (bis 23 s)
  # liegt darueber. Bestandsgrenze, keine neue, aber mit 30 Runden trifft man
  # sie oefter.
  max_iterations: 30
  deadline_s: 900
  token_budget: 900000

  # propose | execute — darf die Schleife eine Aenderung auch BESTAETIGEN?
  # `propose` haelt die Bestaetigungs-Wall: kuratierende Werkzeuge laufen bis
  # zur Vorschau, das Ausfuehren bleibt beim Menschen. `execute` ist die
  # bewusste Entscheidung eines Gastgebers, der eine angemeldete Person vor sich
  # hat (App mit WLO-Sitzung, Browser-Plugin). Nichts, was schreibt, ist
  # standardmaessig an.
  write_mode: propose

# Schalter des laufenden Betriebs (Paket 7, Nutzer-Entscheid 2026-10-09). Wirken
# ohne Neustart. Ist die Umgebungsvariable dahinter gesetzt, geht sie vor
# (Betrieb ohne Studio, Notbremse) — leer gilt als nicht gesetzt.
betrieb:
  # LLM_SERVICE_TIER: OpenAI-Stufe `fast`, gemessen ~30 % schneller, zum 4- bis
  # 5-fachen Tokenpreis und ohne EU-Datenhaltung. Nur OpenAI direkt, gpt-5/gpt-6.
  fast_modus: false
  # CHAT_TOKEN_STREAMING: die Antwort erscheint, waehrend das Modell schreibt.
  # Live-Proben 2026-10-03: kein sichtbarer Sprung (Drift 0/6). Im Agent-Modus
  # erst mit den Agent-Schnellantworten (die Antwort kommt dann ueber
  # `respond_to_user`).
  token_streaming: true
  # AGENT_INLINE_QUICK_REPLIES: der Agent schreibt die Schnellantworten gleich
  # mit (Zug 12,2 → 6,8 s). Erst einschalten, wenn der Master-Skill-Abschnitt
  # „Schnellantworten" angepasst ist (Text: docs/plans/2026-09-30-muster-kette-zeit.md).
  agent_schnellantworten: false
  # Ohne persoenliche Anmeldung mit dem Dienstkonto der Anlage (MCP_AUTH_TOKEN)
  # schreiben — in beiden Modi, fuer jede Person im Chat. Vorgabe aus: schreiben
  # kann nur, wer mit dem eigenen WLO-Konto angemeldet ist (P5-9). Bewusst ohne
  # Umgebungsvariable.
  gastkonto_schreibt: false
