# ABGELÖST durch themenbaum („Themenbaum erstellen“, Plan 2026-11-16, TG-6, G-E2): ab Werk aus,
# nicht gelöscht. Die Wendungen kollidieren nicht mit denen von themenbaum, solange er aus ist.
# Ablauf „Themenbaum · aus einem Dokument“ (Plan docs/plans/2026-11-11-themenbaum-ausloesen-und-wissen.md,
# TW-4, Entscheid E6). Die Person lässt ein Dokument lesen (etwa einen Lehrplan) — im Auswahlfeld
# mit „Lesen lassen“ (aktion dokument → Teil document) — und beantwortet Fragen, bevor die KI den
# Entwurf mit aus_dokument erzeugt. Danach endet der Ablauf — Sammlungen daraus anzulegen, kommt
# später. Plan 2026-11-17, U6: das Upload-Feld fragt selbst, wo verarbeitet wird, und antwortet mit
# ``aktion: bereitgestellt`` — gelesen ist das Dokument dann, wenn ein Teil ``strukturdokument``
# da ist (hier im Chat gelesen oder in WLO abgelegt); ``document`` schreibt nur die alte Antwort.
#
# - Zuerst die Wahl, den Ablauf zu nutzen (N16) — vor dem Upload (Rückmeldung 11.11.: die Frage
#   kam erst nach dem Lesen).
# - Review TG-2, M4 (G-E6): liegt schon ein LESBARES Dokument im Vorgang (im freien Chat gelesen),
#   bietet der Einstieg es an, statt neu hochladen zu lassen. Zweites Review (MINOR 4–6): zuerst
#   prüft der Dienst ``bereitgestellt``, was nutzbar bereitliegt (Teil ``bereit``), dann eine von
#   zwei Fassungen des Einstiegs — die Leiste zählt so ohne Sprung. „Anderes wählen“ verwirft das
#   alte Dokument (MAJOR 1). Die Frage nach dem Lesen und ihr Ausstieg (früher
#   ``gelesen_frage``/``frei``, nur vom Modul-Auslöser erreicht) sind entfallen.
# - Plan 2026-11-16, TG-2 (G-E6): kein Modul-Auslöser mehr — das Upload-Feld ist zielneutral, ein
#   gelesenes Dokument startet nichts von selbst; die KI fragt und schlägt diesen Ablauf vor.
# - Die Vorgaben am KI-Schritt tragen das Wissen aus dem Gestaltungsleitfaden zu Lehrplänen
#   (Lernfelder, Themenfelder, was kein Punkt ist) an den Generator (TW-2).
id: themenbaum_aus_dokument
titel: {de: "Themenbaum · aus einem Dokument", en: "Topic tree · from a document"}
beschreibung: >-
  Ein Dokument wie ein Lehrplan wird gelesen; zwei kurze Fragen (Ordnung, wofür), dann ein
  bearbeitbarer Themenbaum-Entwurf nach den Lernfeldern oder Themenfeldern des Dokuments.
wann:
  - Die Person will einen Themenbaum aus einem Dokument, etwa einem Lehrplan oder Rahmenlehrplan
nicht_wann:
  - Die Person will einen Themenbaum nur aus einem Thema, ohne Dokument
# Im Werkszustand an (Nutzer-Entscheid 11.11.): schreibt nichts ins Repositorium.
# Plan 2026-11-16, TG-6: abgelöst durch themenbaum — bleibt als Werksfassung, ab Werk aus.
aktiv: false
# Paket R2-b: ohne „Dokument im Chat“ (Studio) kann der Ablauf nichts lesen — dann startet er nicht
voraussetzungen: [dokument_lesen]
ausloeser:
  - {art: knopf}
  # TW-6 (Rückmeldung 12.11.): direkt — der Ablauf beginnt mit einer Frage, und ein Upload-Feld
  # allein schreibt nichts (``werkzeuge.ablauf_schreibt_selbst``)
  - {art: agent, modus: direkt}
  - art: text
    # Höchstens 10 Wendungen (Prüfung): Weiteres („Kernlehrplan“, „… zu meinem Lehrplan“, das auch
    # Fragen nach einem vorhandenen Baum träfe) entscheidet die KI über ``wann``/``nicht_wann``
    wendungen: [themenbaum aus einem lehrplan, themenbaum aus dem lehrplan,
                themenbaum aus meinem lehrplan, aus meinem lehrplan einen themenbaum,
                themenbaum aus dem dokument, themenbaum aus dem rahmenlehrplan,
                themenbaum aus dem bildungsplan, themenbaum aus dem kerncurriculum,
                themenbaum aus diesem pdf, themenbaum aus einem dokument]
schritte:
  # Zweites Review TG-2: was im Vorgang nutzbar bereitliegt — ohne LLM, liefert immer ein Ergebnis
  - id: bereit
    typ: werkzeug
    werkzeug: bereitgestellt
    schreibt: bereit
    bei_fehler: einstieg
  - id: vorhanden
    typ: verzweigung
    weiter:
      - {wenn_wert: {quelle: teil.bereit.dokument.lesbar, vergleich: gleich, wert: ja}, dann: einstieg_mit}
      - {sonst: einstieg}
  - id: einstieg
    typ: nachricht
    # Die Wahl wird der Teil ``vorgehen`` (deutsches Label) — nach dem Lesen verzweigt ``nach_lesen``
    schreibt: vorgehen
    text: {de: "Gern baue ich aus deinem Dokument einen Themenbaum. Ich führe dich in wenigen Schritten durch: Dokument wählen, zwei kurze Fragen, Entwurf. Mit den Fragen wird er passender – oder soll ich nach dem Lesen gleich entwerfen?",
           en: "I'll gladly build a topic tree from your document. I'll guide you in a few steps: choose the document, two short questions, draft. The questions make it fit better – or shall I draft right after reading?"}
    optionen:
      - {id: fragen, label: {de: "Ja, mit Fragen", en: "Yes, with questions"}, ziel: hochladen}
      - {id: gleich, label: {de: "Gleich entwerfen", en: "Draft right away"}, ziel: hochladen}
      - {id: ohne, label: {de: "Ohne Führung, frei im Chat", en: "Without guidance, free chat"}, ziel: frei_anfang}
  # Die zweite Fassung des Einstiegs: das gelesene Dokument liegt bereit. Die Wahl wird ``vorgehen``
  # wie oben; „Ja, dieses verwenden“ führt zu den Fragen. In Beschriftungen wirken keine
  # Platzhalter — der Name steht im Text.
  - id: einstieg_mit
    typ: nachricht
    schreibt: vorgehen
    text: {de: "Gern baue ich aus deinem Dokument „{teil.bereit.dokument.name}“ einen Themenbaum: zwei kurze Fragen, dann der Entwurf. Soll ich dieses Dokument verwenden?",
           en: "I'll gladly build a topic tree from your document “{teil.bereit.dokument.name}”: two short questions, then the draft. Shall I use this document?"}
    optionen:
      - {id: verwenden, label: {de: "Ja, dieses verwenden", en: "Yes, use it"}, ziel: nach_lesen}
      - {id: andere, label: {de: Anderes wählen, en: Choose another}, ziel: hochladen, verwirft: [document]}
      - {id: ohne, label: {de: "Ohne Führung, frei im Chat", en: "Without guidance, free chat"}, ziel: frei_anfang}
  - id: hochladen
    typ: modul
    modul: ui_upload
    # Eine einzeln gewählte Datei markiert das Auswahlfeld selbst als Strukturdokument (11.11.)
    text: {de: "Wähle das Dokument (etwa einen Lehrplan), dann, wo es verarbeitet wird, und klick auf „Hochladen“.",
           en: "Choose the document (such as a curriculum), then where it should be processed, and click “Upload”."}
    daten: {zweck: sammlungsstruktur, einzeldatei_als_struktur: true}
  # Nach der Antwort des Auswahlfelds.
  - id: gelesen
    typ: verzweigung
    weiter:
      - {wenn_teil: strukturdokument, dann: nach_lesen}
      - {wenn_teil: document, dann: nach_lesen}
      - {sonst: ohne_dokument}
  # Mit der Wahl vom Anfang weiter (``einstieg`` schreibt ``vorgehen`` immer)
  - id: nach_lesen
    typ: verzweigung
    weiter:
      - {wenn_wert: {quelle: teil.vorgehen, vergleich: gleich, wert: Gleich entwerfen}, dann: entwurf}
      - {sonst: ordnung}
  - id: ordnung
    typ: nachricht
    text: {de: "Wonach soll die erste Ebene geordnet sein?", en: "What should the first level be ordered by?"}
    schreibt: ordnung
    optionen:
      - {id: lernfelder, label: {de: Lernfelder (Berufsschule), en: Learning fields (vocational)}, ziel: wofuer}
      - {id: themenfelder, label: {de: Themenfelder, en: Topic fields}, ziel: wofuer}
      - {id: kapitel, label: {de: Wie im Dokument, en: As in the document}, ziel: wofuer}
    # Rückmeldung 13.11.: getippte Antworten schalten weiter (sonst lagen sie bei der KI)
    freitext: {ziel: wofuer, schreibt: ordnung}
  - id: wofuer
    typ: nachricht
    text: {de: "Wofür soll der Themenbaum sein? Wähle aus oder schreib es in eigenen Worten.",
           en: "What is the topic tree for? Pick one or tell me in your own words."}
    schreibt: zweck
    optionen:
      - {id: unterricht, label: {de: Unterricht planen, en: Plan lessons}, ziel: entwurf}
      - {id: materialpool, label: {de: Materialpool aufbauen, en: Build a material pool}, ziel: entwurf}
      - {id: redaktion, label: {de: Redaktionelle Sammlung, en: Editorial collection}, ziel: entwurf}
    freitext: {ziel: entwurf, schreibt: zweck}
  - id: entwurf
    typ: agent
    text: {de: "Danke! Gibt es Schwerpunkte, die nicht fehlen dürfen? Schreib sie mir – oder klick auf „Entwurf erstellen“.",
           en: "Thanks! Any focus areas that must not be missing? Tell me – or click “Create draft”."}
    agent:
      werkzeuge: [ui_strukturentwurf]
      hinweis:
        de: "Rufe ui_strukturentwurf mit aus_dokument: true auf, thema = Titel des Dokuments; Ordnung, Zweck und Wünsche als hinweise."
        en: "Call ui_strukturentwurf with aus_dokument: true, thema = the document's title; order, purpose and wishes as hinweise."
      startknopf: {de: Entwurf erstellen, en: Create draft}
      vorgaben:
        de: |-
          Das Dokument ist meist ein Lehrplan. So wird er ein Themenbaum:
          - Ebene 1: die Ordnung aus den Hinweisen. „Lernfelder“: je Lernfeld ein Punkt (Berufsschule; die Handlung ist das Ordnungsprinzip). „Themenfelder“: je Themenfeld oder Inhaltsbereich ein Punkt. „Wie im Dokument“: die fachlichen Kapitel. Reihenfolge wie im Dokument, Titel kurz nach dem Thema, ohne Nummern wie „LF 3“ oder „TF 2“.
          - Ebene 2: Themen des Abschnitts — Fachbegriffe und Inhalte, in der Berufsschule die Inhalte bzw. Handlungsschritte des Lernfelds; Lernsituationen nur, wenn das Dokument sie nennt.
          - Nach dem Zweck: „Unterricht planen“ übernimmt die Reihenfolge des Dokuments als Unterrichtsfolge, „Materialpool“ sachliche Titel, „Redaktionelle Sammlung“ publikumsnahe Titel.
          - Keine Punkte: Kompetenzerwartungen, Kompetenzbereiche, Basiskonzepte, Kontexte und Anwendungsbeispiele, Differenzierung, Leistungsbewertung, didaktische Hinweise, Stundentafeln, Zeitrichtwerte, Vorwort, Leitgedanken.
          - Ohne Fragen: wähle selbst die tragende Ordnung des Dokuments (Lernfelder vor Themenfeldern vor Kapiteln).
        en: |-
          The document is usually a curriculum. This is how it becomes a topic tree:
          - Level 1: the order given in the hints. "Learning fields": one item per learning field (vocational school; the occupational task is the ordering principle). "Topic fields": one item per topic field or content area. "As in the document": the subject chapters. Keep the document's order, short topic titles, no numbers like "LF 3" or "TF 2".
          - Level 2: the topics of the section — subject terms and content, in vocational school the content or task steps of the learning field; learning situations only if the document names them.
          - By purpose: "Plan lessons" keeps the document's order as teaching sequence, "Material pool" uses factual titles, "Editorial collection" audience-friendly titles.
          - Not items: expected competences, competence areas, basic concepts, contexts and application examples, differentiation, assessment, didactic notes, timetables, time guidelines, preface, guiding principles.
          - Without questions: choose the document's main order yourself (learning fields before topic fields before chapters).
      ausgabe: draft
      zuege: 3
    bei_fehler: ohne_entwurf
  - id: ende
    typ: ende
    text: {de: "Dein Themenbaum-Entwurf ist gespeichert. Du kannst ihn herunterladen oder später weiter bearbeiten.",
           en: "Your topic tree draft is saved. You can download it or keep editing it later."}
  # Review 12.11., Befund 3: Ausstieg vor dem Upload — noch ohne Dokument
  - id: frei_anfang
    typ: ende
    ausstieg: true
    text: {de: "Gut, dann ohne Führung – wir machen frei im Chat weiter.",
           en: "Alright, no guidance then – let's carry on freely in the chat."}
  # Review TW-4, Befund 4: ohne gelesenes Dokument ein neuer Versuch statt eines harten Endes
  - id: ohne_dokument
    typ: nachricht
    text: {de: "Es ist kein Dokument gelesen worden. Wähle es noch einmal – „Hier im Chat“ oder „In WLO ablegen und erschließen“, nicht nur die Namen – und klick auf „Hochladen“, oder beende den Ablauf.",
           en: "No document has been read. Choose it again – “Here in the chat” or “Store and index in WLO”, not just the names – and click “Upload”, or end the workflow."}
    optionen:
      - {id: nochmal, label: {de: Nochmal wählen, en: Choose again}, ziel: hochladen}
      - {id: beenden, label: {de: Beenden, en: End}, ziel: beendet}
  - id: beendet
    typ: ende
    text: {de: "Gut, ich höre hier auf.", en: "Alright, I'll stop here."}
  # Plan 2026-11-16, TG-6 (kein stummes Ende): ein neuer Versuch oder frei weiter
  - id: ohne_entwurf
    typ: nachricht
    text: {de: "Diesmal ist kein Entwurf entstanden. Soll ich es noch einmal versuchen?",
           en: "No draft came out this time. Shall I try again?"}
    optionen:
      - {id: nochmal, label: {de: Nochmal versuchen, en: Try again}, ziel: entwurf}
      - {id: frei, label: {de: Frei weiter, en: Continue freely}, ziel: frei_anfang}
tests:
  - name: Vom Start mit Fragen bis zum Entwurf
    eingaben:
      - {bei: einstieg, option: fragen}
      - bei: hochladen
        antwort: &dokument
          aktion: dokument
          struktur: {name: Auswahl, dateien: 1, alle_dateien: 1, kinder: []}
          zahlen: {ordner: 0, dateien: 1, inhalte: 0, ignoriert: 0, strukturdokumente: 1, bytes: 1000}
          strukturdokument: {name: Rahmenlehrplan.pdf, groesse: 1000, endung: pdf}
          warnungen: []
          dokument:
            upload_id: 11111111-1111-4111-8111-111111111111
            name: Rahmenlehrplan.pdf
            format: pdf
            befund: {seiten: 40, woerter: 9000, abschnitte: 12, gliederung_art: ueberschriften, warnungen: []}
            vorschau: []
      - {bei: ordnung, option: lernfelder}
      - {bei: wofuer, option: unterricht}
      - bei: entwurf
        teile: {draft: {titel: Augenoptik, quelle: dokument, knoten: [{titel: Kundenberatung}]}}
    erwartet: {weg: [bereit, vorhanden, einstieg, hochladen, gelesen, nach_lesen, ordnung, wofuer, entwurf, ende],
               status: fertig, teile: [vorgehen, document, ordnung, zweck, draft]}
  - name: Vom Start gleich entwerfen
    eingaben:
      - {bei: einstieg, option: gleich}
      - {bei: hochladen, antwort: *dokument}
      - bei: entwurf
        teile: {draft: {titel: Augenoptik, quelle: dokument, knoten: [{titel: Kundenberatung}]}}
    erwartet: {weg: [bereit, vorhanden, einstieg, hochladen, gelesen, nach_lesen, entwurf, ende], status: fertig}
  # Plan 2026-11-17, U6: die neue Antwort ``bereitgestellt`` (hier im Chat gelesen) schreibt nur
  # ``strukturdokument``, kein ``document``
  - name: Hier im Chat gelesen, gleich entwerfen
    angemeldet: false
    eingaben:
      - {bei: einstieg, option: gleich}
      - bei: hochladen
        antwort:
          aktion: bereitgestellt
          ort: chat
          struktur:
            name: Auswahl
            dateien: 1
            alle_dateien: 1
            kinder: []
            dateiliste: [{i: 0, name: Rahmenlehrplan.pdf, endung: pdf, groesse: 1000, rolle: struktur}]
          zahlen: {ordner: 1, dateien: 1, inhalte: 0, ignoriert: 0, strukturdokumente: 1, bytes: 1000}
          strukturdokument: {name: Rahmenlehrplan.pdf, groesse: 1000, endung: pdf}
          warnungen: []
          dateien: [{i: 0, rolle: struktur, upload_id: 11111111-1111-4111-8111-111111111111}]
      - bei: entwurf
        teile: {draft: {titel: Augenoptik, quelle: dokument, knoten: [{titel: Kundenberatung}]}}
    erwartet: {weg: [bereit, vorhanden, einstieg, hochladen, gelesen, nach_lesen, entwurf, ende],
               status: fertig, teile: [strukturdokument, draft]}
  - name: Ohne Führung gleich am Anfang
    eingaben:
      - {bei: einstieg, option: ohne}
    erwartet: {weg: [bereit, vorhanden, einstieg, frei_anfang], status: fertig}
  # Review 12.11., Befund 4: die Wahl vom Anfang trägt über „Nochmal wählen“ hinweg
  - name: Gleich entwerfen über Nochmal wählen
    eingaben:
      - {bei: einstieg, option: gleich}
      - bei: hochladen
        antwort:
          aktion: erfasst
          struktur: {name: Unterlagen, dateien: 1, alle_dateien: 1, kinder: []}
          zahlen: {ordner: 1, dateien: 1, inhalte: 1, ignoriert: 0, strukturdokumente: 0, bytes: 1000}
          strukturdokument: null
          warnungen: []
      - {bei: ohne_dokument, option: nochmal}
      - {bei: hochladen, antwort: *dokument}
      - bei: entwurf
        teile: {draft: {titel: Augenoptik, quelle: dokument, knoten: [{titel: Kundenberatung}]}}
    erwartet: {weg: [bereit, vorhanden, einstieg, hochladen, gelesen, ohne_dokument, hochladen, gelesen, nach_lesen,
                     entwurf, ende], status: fertig}
  # Review TG-2, M4 / zweites Review: das im freien Chat gelesene Dokument liegt schon im Vorgang
  - name: Schon gelesenes Dokument verwenden, mit Fragen
    teile: {document: {ref: "dokument:11111111-1111-4111-8111-111111111111", name: Rahmenlehrplan.pdf}}
    eingaben:
      - {bei: einstieg_mit, option: verwenden}
      - {bei: ordnung, option: lernfelder}
      - {bei: wofuer, option: materialpool}
      - bei: entwurf
        teile: {draft: {titel: Augenoptik, quelle: dokument, knoten: [{titel: Kundenberatung}]}}
    erwartet: {weg: [bereit, vorhanden, einstieg_mit, nach_lesen, ordnung, wofuer, entwurf, ende],
               status: fertig, teile: [bereit, vorgehen, ordnung, zweck, draft]}
  - name: Schon gelesenes Dokument, aber ein anderes wählen
    teile: {document: {ref: "dokument:11111111-1111-4111-8111-111111111111", name: Alt.pdf}}
    eingaben:
      - {bei: einstieg_mit, option: andere}
      - {bei: hochladen, antwort: *dokument}
      - {bei: ordnung, option: themenfelder}
      - {bei: wofuer, option: unterricht}
      - bei: entwurf
        teile: {draft: {titel: Augenoptik, quelle: dokument, knoten: [{titel: Kundenberatung}]}}
    erwartet: {weg: [bereit, vorhanden, einstieg_mit, hochladen, gelesen, nach_lesen, ordnung, wofuer,
                     entwurf, ende], status: fertig}
  # Zweites Review TG-2, MAJOR 1: „Anderes wählen“ verwirft das alte Dokument — wer danach nur
  # „Senden“ schickt, bekommt die Rückfrage statt still den Entwurf aus dem abgelehnten. U6: mit
  # ``document`` geht auch ``strukturdokument`` (Alias, ``typen.mit_aliassen``) — ``gelesen`` prüft
  # ihn jetzt
  - name: Anderes wählen, dann nur Senden
    teile:
      document: {ref: "dokument:11111111-1111-4111-8111-111111111111", name: Alt.pdf}
      strukturdokument: {dokumente: [{quelle: chatbot, ref: "dokument:11111111-1111-4111-8111-111111111111",
                                      name: Alt.pdf}]}
    eingaben:
      - {bei: einstieg_mit, option: andere}
      - bei: hochladen
        antwort:
          aktion: erfasst
          struktur: {name: Unterlagen, dateien: 1, alle_dateien: 1, kinder: []}
          zahlen: {ordner: 1, dateien: 1, inhalte: 1, ignoriert: 0, strukturdokumente: 0, bytes: 1000}
          strukturdokument: null
          warnungen: []
      - {bei: ohne_dokument, option: beenden}
    erwartet: {weg: [bereit, vorhanden, einstieg_mit, hochladen, gelesen, ohne_dokument, beendet],
               status: fertig}
  - name: Nur erfasst, kein Dokument
    eingaben:
      - {bei: einstieg, option: fragen}
      - bei: hochladen
        antwort:
          aktion: erfasst
          struktur: {name: Unterlagen, dateien: 1, alle_dateien: 1, kinder: []}
          zahlen: {ordner: 1, dateien: 1, inhalte: 1, ignoriert: 0, strukturdokumente: 0, bytes: 1000}
          strukturdokument: null
          warnungen: []
      - {bei: ohne_dokument, option: beenden}
    erwartet: {weg: [bereit, vorhanden, einstieg, hochladen, gelesen, ohne_dokument, beendet], status: fertig}
