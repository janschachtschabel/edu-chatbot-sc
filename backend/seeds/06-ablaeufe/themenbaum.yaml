            - {i: 0, name: A.pdf, endung: pdf, groesse: 10, rolle: inhalt}
            - {i: 1, name: B.pdf, endung: pdf, groesse: 10, rolle: inhalt}
            - {i: 2, name: C.pdf, endung: pdf, groesse: 10, rolle: inhalt}
            - {i: 3, name: D.pdf, endung: pdf, groesse: 10, rolle: inhalt}
            - {i: 4, name: E.pdf, endung: pdf, groesse: 10, rolle: inhalt}
      metadaten: *fremde_angaben
    eingaben:
      - {bei: einstieg_mit, option: andere}
      - {bei: grundlage, text: "Lerninhalte der Zellbiologie"}
      - {bei: wofuer, text: "für eine Webseite"}
      - {bei: stufe, option: alle}
      - {bei: umfang, text: "nicht zu fein, eher grob"}
      - {bei: hinweise, text: "nein"}
