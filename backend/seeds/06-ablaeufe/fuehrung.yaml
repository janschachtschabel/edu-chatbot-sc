# Ablauf „Führung durch WLO“ — Nachbau der eingebauten Web-Tour (Plan
# docs/plans/2026-11-15-webseitenfuehrung-als-ablauf.md, WF-6). Erzeugt aus
# 01-base/website-tour.yaml: dieselben Texte (de/en), Gruppen, Synonyme, Zielseiten und Angebote.
# Ändert die Redaktion die eingebaute Tour, gilt diese Fassung weiter, bis sie hier nachzieht.
#
# Bewusste Abweichungen vom Original (Plan, Entscheide E2, E3 und WF-2):
# - Pfade relativ statt base_host: der Chip öffnet die Seite auf dem Host, auf dem das Widget läuft.
# - Lehrkraft, Lernende und Eltern stehen vor Content-Abnehmer — „Lehrerin an einer Grundschule“
#   landete im Original wegen „schule“ bei Content-Abnehmer.
# - Wie im Original endet die Führung still, wenn die Person in einem Seiten-Schritt etwas Eigenes
#   tippt oder an der Gruppenwahl zum zweiten Mal nichts trifft (endet_bei_text); die Nachricht
#   geht an den Chat.
# - Das Synonym „oer“ fehlt (es steckt in „Boerdi“); „OER-Community“ und „oer community“ treffen.
# - Das Widget öffnet sich von selbst, solange ein Seiten-Schritt wartet (das Original in jedem
#   Schritt).
# - Beim Einstieg mitten drin folgt auf den Einstiegstext der volle Lösungen-Text.
#
# Aus, bis die Redaktion sie einschaltet (aktiv: true) und die eingebaute Tour abschaltet
# (01-base/website-tour.yaml: enabled: false).
id: fuehrung
titel:
  de: Führung durch WLO
  en: Tour of WLO
beschreibung: 'Führt in wenigen Schritten durch WirLernenOnline: Selbstzuordnung, die Seite der eigenen
  Gruppe, die Bildungsinhalte, passende Angebote und am Ende die Mitmach-Seite für eine Anfrage. Steigt
  mitten ein, wenn die Person schon auf einer Zielgruppen- oder Angebotsseite ist.'
wann:
- Die Person möchte WLO kennenlernen, eine Führung über die Webseite oder sucht den Weg zum Mitmachen
