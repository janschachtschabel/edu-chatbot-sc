    muster:
    - /angebote/*
    - /bildungsinhalte/*
    - /fachportale/*
    - /home/*
    - /mitmachen/ueber-wlo
    - /mitmachen/faq
    text:
      de: 'Schau dich hier ruhig in Ruhe um. Wenn du bereit für die Anfrage bist, geht''s weiter: 👇'
