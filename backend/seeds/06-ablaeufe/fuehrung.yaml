        move on: 👇'
  weiter: kontakt
- id: kontakt
  typ: ende
  text:
    de: 'Fast geschafft! 🎯 Hier auf der **Mitmach-Seite** kannst du deine Anfrage stellen oder direkt
      Kontakt aufnehmen — alles Wichtige dazu findest du hier, ganz unkompliziert. Danke fürs Mitkommen
      — und meld dich jederzeit, wenn noch etwas offen ist!


      **Das brauchst du noch:**

      - [Über WLO](/mitmachen/ueber-wlo/)

      - [FAQ](/mitmachen/faq/)'
    en: 'Almost there! 🎯 Here on the **get-involved page** you can send your enquiry or get in touch directly
      — everything that matters is right here, no fuss. Thanks for coming along — and get in touch any
      time if anything is still open!


      **You might still need this:**

      - [About WLO](/mitmachen/ueber-wlo/)

      - [FAQ](/mitmachen/faq/)'
